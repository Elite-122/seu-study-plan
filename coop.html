<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem("najd_theme")==="dark"?"dark":"light";d.setAttribute("data-theme",t);if(localStorage.getItem("najd_lang")==="en"){d.lang="en";d.dir="ltr";}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التدريب التعاوني | أكاديمية نجد</title>
<meta name="description" content="فرص التدريب التعاوني في مدن المملكة: فلتر حسب المدينة والتخصص، وشوف المكافأة والمدة وآخر موعد للتقديم.">
<meta name="theme-color" content="#2F4F4E">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/najd.css?v=20261110k">
<style>
#najd .cp-stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 0}
#najd .cp-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 18px;min-width:120px}
#najd .cp-stat b{display:block;font-size:26px;font-weight:800;line-height:1.2;color:#fff}
#najd .cp-stat span{font-size:14px;color:var(--mist)}

/* الفلاتر */
#najd .cp-filters{position:sticky;top:74px;z-index:10}
#najd .cp-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#najd .cp-search{flex:1 1 260px;position:relative}
#najd .cp-search input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 44px 0 14px;font-size:16px;color:var(--ink)}
#najd .cp-search input:focus{background:var(--surface);border-color:var(--teal)}
#najd .cp-search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--slate)}
#najd .cp-sel{height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;font-size:15.5px;color:var(--ink);flex:0 1 210px;min-width:0}
#najd .cp-tg{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;cursor:pointer;padding:0 4px;white-space:nowrap}
#najd .cp-tg input{width:20px;height:20px;accent-color:var(--teal);margin:0}
#najd .cp-lbl{display:block;font-size:14px;font-weight:700;color:var(--slate);margin:16px 0 8px}
#najd .cp-cities{display:flex;gap:8px;flex-wrap:wrap}
#najd .cp-city{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
#najd .cp-city:hover{border-color:var(--teal)}
#najd .cp-city small{font-size:12.5px;font-weight:800;background:var(--tint);color:var(--teal);border-radius:999px;padding:0 8px;line-height:20px}
#najd .cp-city.is-zero{color:var(--slate);font-weight:500}
#najd .cp-city.is-zero small{background:var(--bg);color:var(--grey)}
#najd .cp-city[aria-pressed="true"]{background:var(--deep);border-color:var(--dtext);color:#fff}
#najd .cp-city[aria-pressed="true"] small{background:rgba(255,255,255,.18);color:#fff}
#najd .cp-more{border:0;background:none;color:var(--teal);font-size:14.5px;font-weight:700;cursor:pointer;padding:0 6px;height:40px;text-decoration:underline;text-underline-offset:3px}

/* النتائج */
#najd .cp-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
#najd .cp-count{font-size:16px;color:var(--muted)}
#najd .cp-count b{color:var(--dtext);font-size:18px}
#najd .cp-reset{border:0;background:none;color:var(--teal);font-weight:700;font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#najd .cp-group{margin:0 0 28px}
#najd .cp-gh{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin:0 0 14px}
#najd .cp-gh span{font-size:14px;font-weight:700;color:var(--teal);background:var(--tint);border-radius:999px;padding:2px 12px}
#najd .cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
#najd .cp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;transition:transform .2s,box-shadow .2s}
#najd .cp-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
#najd .cp-card.is-closed{opacity:.6}
#najd .cp-hd{display:flex;gap:12px;align-items:flex-start}
#najd .cp-av{flex-shrink:0;width:50px;height:50px;border-radius:14px;background:linear-gradient(150deg,var(--teal),var(--deep));color:#fff;font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:center}
#najd .cp-hd h3{font-size:18.5px;font-weight:800;line-height:1.4}
#najd .cp-loc{font-size:14px;color:var(--slate);display:flex;align-items:center;gap:4px}
#najd .cp-tags{display:flex;flex-wrap:wrap;gap:6px}
#najd .cp-tag{font-size:13px;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:2px 10px}
#najd .cp-info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#najd .cp-info div{background:var(--bg);border-radius:12px;padding:8px 12px}
#najd .cp-info small{display:block;font-size:12.5px;color:var(--slate)}
#najd .cp-info b{font-size:15px;font-weight:800;color:var(--dtext)}
#najd .cp-info .is-money b{color:#3E6A3A}
#najd .cp-notes{font-size:14.5px;color:var(--muted)}
#najd .cp-ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
#najd .cp-dl{font-size:13.5px;font-weight:800;border-radius:999px;padding:4px 12px;background:var(--tint);color:var(--teal);white-space:nowrap}
#najd .cp-dl.is-soon{background:#F3E9CF;color:#6B5320}
#najd .cp-dl.is-closed{background:#F0DEDB;color:#8E3F37}
#najd .cp-ft .nj-btn{height:42px;padding:0 18px;font-size:15px}
#najd .cp-empty{text-align:center;padding:44px 20px}
#najd .cp-empty b{display:block;font-size:20px;font-weight:800;margin:8px 0 4px}
#najd .cp-empty p{color:var(--muted)}
#najd .cp-sk{height:250px;border-radius:var(--r);background:linear-gradient(90deg,#fff 0%,var(--light) 50%,#fff 100%);background-size:200% 100%;animation:cpSk 1.3s infinite linear;border:1px solid var(--line)}
@keyframes cpSk{to{background-position:-200% 0}}
#najd .cp-note{font-size:14px;color:var(--slate);text-align:center;margin:20px 0 0}

@media (max-width:860px){
#najd .cp-filters{position:static}
#najd .cp-cities{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:thin}
#najd .cp-sel{flex:1 1 140px}
#najd .cp-more{display:none}
}
@media (max-width:400px){#najd .cp-grid{grid-template-columns:1fr}#najd .cp-info{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="najd" dir="rtl" data-page="coop">
<div id="nj-header"></div>
<section class="nj-band">
<svg class="nj-band-mark" viewBox="14 20 92 84" aria-hidden="true"><path d="M26 48 L36 36 L46 48 Z" fill="#758A8C"/><path d="M50 48 L60 30 L70 48 Z" fill="#7A9FA3"/><path d="M74 48 L84 24 L94 48 Z" fill="#C8CFD2"/><path d="M58 100 L18 88 V56 L58 68 Z" fill="#C8CFD2"/><path d="M62 100 L102 88 V56 L62 68 Z" fill="#E4E9EB"/></svg>
<div class="nj-in">
<p class="nj-crumb"><a href="index.html">الرئيسية</a><span>/</span>التدريب التعاوني</p>
<h1>فرص التدريب التعاوني</h1>
<p class="nj-band-sub">اختر مدينتك وتخصصك، وشوف الفرص المتاحة: المكافأة، والمدة، وآخر موعد للتقديم. متاحة للكل بدون تسجيل دخول.</p>
<div class="cp-stats"><div class="cp-stat"><b id="cp-s-open">–</b><span>فرصة متاحة</span></div><div class="cp-stat"><b id="cp-s-cities">–</b><span>مدينة</span></div><div class="cp-stat"><b id="cp-s-soon">–</b><span>تنتهي خلال أسبوع</span></div></div>
</div>
</section>
<main class="nj-main">
<div class="nj-in">
<div class="nj-card cp-filters">
<div class="cp-top">
<label class="cp-search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg><input id="cp-q" type="search" placeholder="ابحث باسم الجهة…" aria-label="ابحث باسم الجهة"></label>
<select class="cp-sel" id="cp-major" aria-label="التخصص"></select>
<select class="cp-sel" id="cp-sort" aria-label="الترتيب"><option value="deadline">آخر موعد: الأقرب</option><option value="new">الأحدث إضافة</option><option value="money">المكافأة: الأعلى</option></select>
<label class="cp-tg"><input type="checkbox" id="cp-paid">بمكافأة فقط</label>
<label class="cp-tg"><input type="checkbox" id="cp-closed">إظهار المنتهية</label>
</div>
<span class="cp-lbl">المدينة</span>
<div class="cp-cities" id="cp-cities" role="group" aria-label="المدينة"></div>
</div>
<div class="cp-bar"><p class="cp-count" id="cp-count" aria-live="polite"></p><button type="button" class="cp-reset" id="cp-reset" hidden>مسح الفلاتر</button></div>
<div id="cp-list"><div class="cp-grid"><div class="cp-sk"></div><div class="cp-sk"></div><div class="cp-sk"></div></div></div>
<p class="cp-note">نجمع الإعلانات من مصادرها الرسمية. تأكد من التفاصيل من رابط التقديم قبل ما تقدم.</p>
</div>
</main>
<div id="nj-footer"></div>
</div>
<script src="assets/js/layout.js?v=20261110k"></script>
<script src="assets/js/i18n.js?v=20261110k"></script>
<script type="module" src="assets/js/auth.js?v=20261110k"></script>
<script src="assets/js/coop-data.js?v=20261110k"></script>
<script>
(function(){
  var D=window.NAJD_COOP,esc=window.Najd.esc,$=function(id){return document.getElementById(id);};
  var all=null,ALL='__all';
  var st={city:ALL,major:'',q:'',sort:'deadline',paid:false,closed:false,more:false};
  try{var u=new URLSearchParams(location.search);if(u.get('city'))st.city=u.get('city');if(u.get('major'))st.major=u.get('major');}catch(e){}

  $('cp-major').innerHTML='<option value="">كل التخصصات</option>'+Object.keys(D.MAJORS).filter(function(k){return k!=='all';}).map(function(k){return '<option value="'+k+'">'+D.MAJORS[k]+'</option>';}).join('');
  $('cp-major').value=st.major;

  function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
  function daysLeft(x){if(!x.deadline)return null;var d=new Date(x.deadline+'T00:00:00');return Math.round((d-today())/864e5);}
  function isOpen(x){var n=daysLeft(x);return n===null||n>=0;}
  function fmtDate(s){try{return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return s;}}
  function money(x){var v=x.stipend;if(v===0||v==='0')return 'بدون مكافأة';if(v==null||v==='')return 'غير محددة';var n=+v;return isNaN(n)?String(v):n.toLocaleString('en-US')+' ريال';}
  function majorsOf(x){var m=x.majors||[];return m.length?m:['all'];}
  function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:(/^[\w.-]+@[\w.-]+$/.test(u)?'mailto:'+u:'');}

  function base(){
    return all.filter(function(x){
      if(!st.closed&&!isOpen(x))return false;
      if(st.paid&&!(+x.stipend>0))return false;
      if(st.major){var m=majorsOf(x);if(m.indexOf('all')<0&&m.indexOf(st.major)<0)return false;}
      if(st.q){var q=st.q.toLowerCase();if(String(x.org||'').toLowerCase().indexOf(q)<0&&String(x.notes||'').toLowerCase().indexOf(q)<0)return false;}
      return true;
    });
  }
  function sortList(l){
    return l.slice().sort(function(a,b){
      if(st.sort==='money')return (+b.stipend||0)-(+a.stipend||0);
      if(st.sort==='new')return (b.createdAt&&b.createdAt.seconds||0)-(a.createdAt&&a.createdAt.seconds||0);
      var oa=isOpen(a),ob=isOpen(b);if(oa!==ob)return oa?-1:1;
      return String(a.deadline||'9999').localeCompare(String(b.deadline||'9999'));
    });
  }
  function card(x){
    var n=daysLeft(x),closed=!isOpen(x),dl;
    if(n===null)dl='<span class="cp-dl">التقديم مفتوح</span>';
    else if(closed)dl='<span class="cp-dl is-closed">انتهى التقديم</span>';
    else if(n===0)dl='<span class="cp-dl is-soon">آخر يوم اليوم!</span>';
    else dl='<span class="cp-dl'+(n<=7?' is-soon':'')+'" title="'+esc(fmtDate(x.deadline))+'">باقي '+(n===1?'يوم':n===2?'يومين':n+(n<=10?' أيام':' يوم'))+'</span>';
    var url=safeUrl(x.link);
    var tags=majorsOf(x).map(function(k){return '<span class="cp-tag">'+esc(D.MAJORS[k]||k)+'</span>';}).join('');
    return '<article class="cp-card'+(closed?' is-closed':'')+'">'
      +'<div class="cp-hd"><span class="cp-av" aria-hidden="true">'+esc(String(x.org||'؟').trim().charAt(0))+'</span><div><h3>'+esc(x.org||'')+'</h3><p class="cp-loc">📍 '+esc(x.city||'')+'</p></div></div>'
      +'<div class="cp-tags">'+tags+'</div>'
      +'<div class="cp-info"><div class="is-money"><small>المكافأة الشهرية</small><b>'+esc(money(x))+'</b></div><div><small>المدة</small><b>'+esc(x.duration||'غير محددة')+'</b></div>'
      +'<div><small>يبدأ</small><b>'+esc(x.start||'غير محدد')+'</b></div><div><small>آخر موعد</small><b>'+(x.deadline?esc(fmtDate(x.deadline)):'غير محدد')+'</b></div></div>'
      +(x.notes?'<p class="cp-notes">'+esc(x.notes)+'</p>':'')
      +'<div class="cp-ft">'+dl+(url&&!closed?'<a class="nj-btn nj-btn-fill" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">قدّم الحين ↗</a>':'')+'</div>'
      +'</article>';
  }
  function renderCities(l){
    var cnt={};l.forEach(function(x){cnt[x.city]=(cnt[x.city]||0)+1;});
    var cities=D.CITIES.slice();Object.keys(cnt).forEach(function(c){if(cities.indexOf(c)<0)cities.push(c);});
    cities.sort(function(a,b){return (cnt[b]||0)-(cnt[a]||0)||D.CITIES.indexOf(a)-D.CITIES.indexOf(b);});
    var withData=cities.filter(function(c){return cnt[c];});
    var shown=st.more?cities:cities.filter(function(c){return cnt[c]||c===st.city;});
    if(!st.more&&withData.length<6)shown=cities.slice(0,Math.max(10,withData.length));
    var o='<button type="button" class="cp-city" data-city="'+ALL+'" aria-pressed="'+(st.city===ALL)+'">كل المدن <small>'+l.length+'</small></button>';
    shown.forEach(function(c){o+='<button type="button" class="cp-city'+(cnt[c]?'':' is-zero')+'" data-city="'+esc(c)+'" aria-pressed="'+(st.city===c)+'">'+esc(c)+' <small>'+(cnt[c]||0)+'</small></button>';});
    if(shown.length<cities.length||st.more)o+='<button type="button" class="cp-more" id="cp-more">'+(st.more?'عرض أقل':'كل المدن ('+cities.length+')')+'</button>';
    $('cp-cities').innerHTML=o;
  }
  function render(){
    if(!all)return;
    var l=base();renderCities(l);
    var view=st.city===ALL?l:l.filter(function(x){return x.city===st.city;});
    view=sortList(view);
    var nOpen=view.filter(isOpen).length;
    $('cp-count').innerHTML=view.length?'<b>'+view.length+'</b> فرصة'+(st.city!==ALL?' في '+esc(st.city):'')+(nOpen<view.length?' ('+nOpen+' متاحة)':''):'';
    $('cp-reset').hidden=!(st.city!==ALL||st.major||st.q||st.paid||st.closed);
    if(!view.length){
      $('cp-list').innerHTML='<div class="nj-card cp-empty"><span style="font-size:40px">🔎</span><b>'+(all.length?'ما فيه فرص تطابق اختيارك'+(st.city!==ALL?' في '+esc(st.city):''):'ما فيه فرص منشورة حاليًا')+'</b><p>'+(all.length?'جرّب مدينة ثانية أو امسح الفلاتر.':'نضيف الفرص أول بأول، ارجع لنا قريب.')+'</p></div>';
      return;
    }
    var o='';
    if(st.city===ALL&&st.sort==='deadline'){
      var groups={},order=[];view.forEach(function(x){if(!groups[x.city]){groups[x.city]=[];order.push(x.city);}groups[x.city].push(x);});
      order.sort(function(a,b){return groups[b].length-groups[a].length;});
      order.forEach(function(c){o+='<section class="cp-group"><h2 class="cp-gh">📍 '+esc(c)+' <span>'+groups[c].length+' فرصة</span></h2><div class="cp-grid">'+groups[c].map(card).join('')+'</div></section>';});
    }else{o='<div class="cp-grid">'+view.map(card).join('')+'</div>';}
    $('cp-list').innerHTML=o;
  }
  function stats(){
    var open=all.filter(isOpen);var cs={};open.forEach(function(x){cs[x.city]=1;});
    $('cp-s-open').textContent=open.length;$('cp-s-cities').textContent=Object.keys(cs).length;
    $('cp-s-soon').textContent=open.filter(function(x){var n=daysLeft(x);return n!==null&&n<=7;}).length;
  }

  $('cp-cities').addEventListener('click',function(e){
    if(e.target.closest('#cp-more')){st.more=!st.more;render();return;}
    var b=e.target.closest('.cp-city');if(!b)return;st.city=b.getAttribute('data-city');render();
    try{var u=new URL(location.href);st.city===ALL?u.searchParams.delete('city'):u.searchParams.set('city',st.city);history.replaceState(null,'',u);}catch(x){}
  });
  var qt;$('cp-q').addEventListener('input',function(){clearTimeout(qt);var v=this.value.trim();qt=setTimeout(function(){st.q=v;render();},200);});
  $('cp-major').addEventListener('change',function(){st.major=this.value;render();});
  $('cp-sort').addEventListener('change',function(){st.sort=this.value;render();});
  $('cp-paid').addEventListener('change',function(){st.paid=this.checked;render();});
  $('cp-closed').addEventListener('change',function(){st.closed=this.checked;render();});
  $('cp-reset').addEventListener('click',function(){st.city=ALL;st.major='';st.q='';st.paid=false;st.closed=false;$('cp-q').value='';$('cp-major').value='';$('cp-paid').checked=false;$('cp-closed').checked=false;render();});

  var failT=setTimeout(function(){if(!all)window.NajdCoop.fail();},15000);
  window.NajdCoop={
    set:function(list){clearTimeout(failT);all=(list||[]).filter(function(x){return x&&x.org&&x.city&&x.active!==false;});stats();render();},
    fail:function(){if(all)return;$('cp-list').innerHTML='<div class="nj-card cp-empty"><span style="font-size:40px">📡</span><b>ما قدرنا نجيب الفرص</b><p>تأكد من اتصالك بالإنترنت وحدّث الصفحة.</p></div>';}
  };
})();
</script>
<script type="module" src="assets/js/coop.js?v=20261110k"></script>
</body>
</html>
