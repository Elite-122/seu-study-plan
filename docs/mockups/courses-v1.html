<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>عيّنة: المقررات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/najd.css">
<style>
body{margin:0;background:var(--bg,#F4F7F7)}
#najd{min-height:0}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
#najd .smp{background:#FFF7E6;color:#5A4519;font-size:13px;font-weight:700;text-align:center;padding:6px}
#najd .cr-band{background:linear-gradient(160deg,#2F4F4E,#1F3837);color:#fff;padding:24px 0 22px}
#najd .cr-band h1{font-size:34px;font-weight:800;margin:0;color:#fff;line-height:1.3}
#najd .cr-band p{color:var(--mist);margin:4px 0 14px;font-size:var(--fs-lg)}
#najd .cr-q{position:relative}
#najd .cr-q input{width:100%;box-sizing:border-box;min-height:52px;border:0;border-radius:var(--r-lg);padding:0 46px 0 14px;font:inherit;font-size:var(--fs-base);background:#fff;color:#1F3837}
#najd .cr-q svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#5F7071}
#najd .cr-bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
#najd .cr-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:5px;box-shadow:var(--shadow)}
#najd .cr-seg button{min-height:44px;border:0;border-radius:var(--r-md);background:none;font:inherit;font-weight:800;font-size:var(--fs-base);color:var(--muted);cursor:pointer}
#najd .cr-seg button[aria-pressed="true"]{background:var(--deep);color:#fff}
#najd .cr-mj{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -2px 0;padding:2px}
#najd .cr-mj::-webkit-scrollbar{display:none}
#najd .cr-mj button{flex-shrink:0;min-height:40px;padding:0 12px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:var(--fs-sm);font-weight:800;color:var(--ink);cursor:pointer}
#najd .cr-mj button[aria-pressed="true"]{border-color:var(--deep);background:var(--tint);color:var(--dtext)}
/* مستواك */
#najd .cr-me{display:flex;align-items:center;gap:14px;margin:12px 0 6px;padding:14px;border-radius:var(--r);background:linear-gradient(160deg,#2F4F4E,#1F3837);color:#fff}
#najd .cr-me b{display:block;font-size:var(--fs-2xl);font-weight:800}
#najd .cr-me small{color:#E2C9A6;font-weight:700;font-size:var(--fs-sm)}
#najd .cr-me .bar{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;min-width:80px}
#najd .cr-me .bar i{display:block;height:100%;background:#D9B48A}
#najd .cr-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:var(--fs-lg);font-weight:800}
#najd .cr-h small{font-size:var(--fs-sm);color:var(--slate);font-weight:700}
#najd .cr-h::after{content:"";flex:1;height:1px;background:var(--line)}
#najd .cr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:760px){#najd .cr-grid{grid-template-columns:minmax(0,1fr)}}
/* بطاقة المقرر */
#najd .cc{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border-inline-start:4px solid var(--c)}
#najd .cc:hover{border-color:var(--teal)}
#najd .cc-top{display:flex;align-items:flex-start;gap:10px}
#najd .cc-code{flex-shrink:0;direction:ltr;font-size:12px;font-weight:800;padding:3px 7px;border-radius:var(--r-sm);background:var(--bg);color:var(--dtext);margin-top:3px}
#najd .cc-t{flex:1;min-width:0}
#najd .cc-t b{display:block;font-size:var(--fs-base);font-weight:800;line-height:1.45}
#najd .cc-t small{display:block;font-size:var(--fs-sm);color:var(--slate);direction:ltr;text-align:right}
#najd .cc-ok{flex-shrink:0;font-size:12px;font-weight:800;color:var(--ok);background:var(--ok-bg);border-radius:var(--r-pill);padding:2px 8px}
#najd .cc-d{font-size:var(--fs-md);color:var(--muted);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
#najd .cc-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:var(--fs-sm);font-weight:700;color:var(--slate)}
#najd .cc-m .st{color:#8A6A2E}
#najd .cc-m .st svg{width:14px;height:14px;vertical-align:-2px;color:#C99A3E}
#najd .cc-m .go{margin-inline-start:auto;color:var(--dtext);display:inline-flex;align-items:center;gap:4px}
#najd .cc-m .go svg{width:16px;height:16px}
#najd .cr-more{display:flex;justify-content:center;align-items:center;gap:6px;width:100%;min-height:44px;margin-top:10px;border:1.5px dashed var(--line);border-radius:var(--r-md);background:none;font:inherit;font-weight:800;color:var(--muted);cursor:pointer}
#najd .cr-empty{text-align:center;color:var(--muted);padding:30px 10px}
#najd mark{background:#F3E6D2;color:inherit;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<div id="najd" dir="rtl">
<div class="smp">عيّنة للموافقة. أرقام التقييم (النجوم) للتوضيح بس، والباقي من بيانات الموقع الحقيقية.</div>
<section class="cr-band"><div class="wrap">
<h1>المقررات</h1>
<p>كل مقرر في خطتك: وصفه، وتجارب الطلاب فيه، ومين يدرّسه.</p>
<div class="cr-q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="q" type="search" placeholder="ابحث بالاسم أو الرمز: محاسبة، ACCT201…" aria-label="ابحث عن مقرر"></div>
</div></section>
<main class="wrap">
<div class="cr-bar"><div class="cr-seg" role="group" aria-label="عرض"><button type="button" data-v="mine" aria-pressed="true">مقرراتك</button><button type="button" data-v="all" aria-pressed="false">كل المقررات</button></div><div class="cr-mj" id="mj" role="group" aria-label="التخصص"></div></div>
<div id="out"></div>
</main>
</div>
<script src="../../assets/js/plans-data.js"></script>
<script src="../../assets/js/courses-data.js"></script>
<script src="../../assets/js/teaching-data.js"></script>
<script>
(async function(){
  var P=window.NAJD_PLANS,META=window.NAJD_COURSE_META||{},TEACH=(window.NAJD_TEACH||{}).C||{},Q=new URLSearchParams(location.search);
  var DESC={};try{DESC=await (await fetch('../../tools/course-desc.json')).json();}catch(e){}
  var major=Q.get('m')||'acct',view=Q.get('v')||'mine',doneLv=+(Q.get('done')||4),q='',openAll={};
  var LV=['السنة الأولى','المستوى الثالث','المستوى الرابع','المستوى الخامس','المستوى السادس','المستوى السابع','المستوى الثامن'];
  var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var STAR=SV.replace('fill="none"','fill="currentColor"')+'<path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4 7.2 18.9l.9-5.4L4.2 9.7l5.4-.8z"/></svg>',GO=SV+'<path d="M15 6l-6 6 6 6"/></svg>';
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hl(s){s=esc(s);if(!q)return s;var i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length);}
  function demo(code){var h=0;for(var i=0;i<code.length;i++)h=(h*31+code.charCodeAt(i))%997;return {r:(3.6+(h%14)/10).toFixed(1),n:3+h%28};}
  function card(c,done){var m=META[c[0]]||['common'],t=TEACH[c[0]],d=(DESC[c[0]]||{}).ar||'',r=demo(c[0]),pre=String(c[4]||'').trim();
    return '<a class="cc" href="../../c/'+c[0]+'.html" style="--c:var(--sec-'+m[0]+',var(--teal))"><div class="cc-top"><span class="cc-code">'+hl(c[0])+'</span><div class="cc-t"><b>'+hl(c[2])+'</b><small>'+hl(c[1])+'</small></div>'+(done?'<span class="cc-ok">خلّصته</span>':'')+'</div>'
      +(d?'<p class="cc-d">'+esc(d)+'</p>':'')
      +'<div class="cc-m"><span>'+c[3]+' '+(c[3]>=3&&c[3]<=10?'ساعات':'ساعة')+'</span>'+(pre&&pre!=='—'?'<span dir="ltr">'+esc(pre)+' :المتطلب</span>':'')+'<span class="st">'+STAR+' '+r.r+' ('+r.n+' تجربة)</span>'+(t?'<span>يدرّسه '+t[1].length+(t[1].length>=3&&t[1].length<=10?' أعضاء':' عضو')+'</span>':'')+'<span class="go">صفحة المقرر'+GO+'</span></div></a>';}
  function draw(){
    var mj='';Object.keys(P).forEach(function(k){mj+='<button type="button" data-m="'+k+'" aria-pressed="'+(k===major)+'">'+esc(P[k].label)+'</button>';});document.getElementById('mj').innerHTML=mj;
    [].forEach.call(document.querySelectorAll('[data-v]'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-v')===view);});
    var lv=P[major].levels,o='';
    if(q){var seen={},hits=[];Object.keys(P).sort(function(a){return a===major?-1:1;}).forEach(function(k){P[k].levels.forEach(function(L){L.courses.forEach(function(c){var s=(c[0]+' '+c[1]+' '+c[2]).toLowerCase();if(!seen[c[0]]&&s.indexOf(q.toLowerCase())>=0){seen[c[0]]=1;hits.push(c);}});});});
      o='<p class="cr-h">نتايج البحث<small>'+hits.length+'</small></p>'+(hits.length?'<div class="cr-grid">'+hits.map(function(c){return card(c,false);}).join('')+'</div>':'<p class="cr-empty">ما لقينا مقرر بهالاسم. جرّب الرمز، مثل ACCT201.</p>');}
    else if(view==='mine'){var h=0,tot=0;lv.forEach(function(L,li){tot+=L.hours;if(li<doneLv)h+=L.hours;});var cur=Math.min(doneLv,lv.length-1);
      o='<div class="cr-me"><div><small>مستواك الحين</small><b>'+LV[cur]+'</b></div><div class="bar"><i style="width:'+Math.round(h/tot*100)+'%"></i></div><small>'+h+' من '+tot+' ساعة</small></div>';
      o+='<p class="cr-h">مقررات مستواك<small>'+lv[cur].courses.length+'</small></p><div class="cr-grid">'+lv[cur].courses.map(function(c){return card(c,false);}).join('')+'</div>';
      if(lv[cur+1])o+='<p class="cr-h">الفصل الجاي: '+LV[cur+1]+'<small>'+lv[cur+1].courses.length+'</small></p><div class="cr-grid">'+lv[cur+1].courses.map(function(c){return card(c,false);}).join('')+'</div>';
      var dn=[];lv.forEach(function(L,li){if(li<cur)dn=dn.concat(L.courses);});
      if(dn.length)o+=openAll.done?'<p class="cr-h">اللي خلّصتها<small>'+dn.length+'</small></p><div class="cr-grid">'+dn.map(function(c){return card(c,true);}).join('')+'</div>':'<button type="button" class="cr-more" data-more="done">اللي خلّصتها ('+dn.length+')</button>';}
    else{lv.forEach(function(L,li){o+='<p class="cr-h">'+LV[li]+'<small>'+L.courses.length+' مقررات · '+L.hours+' ساعة</small></p><div class="cr-grid">'+L.courses.map(function(c){return card(c,false);}).join('')+'</div>';});}
    document.getElementById('out').innerHTML=o;
  }
  document.addEventListener('click',function(e){var b=e.target.closest('[data-v],[data-m],[data-more]');if(!b)return;if(b.dataset.v)view=b.dataset.v;if(b.dataset.m)major=b.dataset.m;if(b.dataset.more)openAll[b.dataset.more]=1;draw();});
  document.getElementById('q').addEventListener('input',function(){q=this.value.trim();draw();});
  if(Q.get('q')){q=Q.get('q');document.getElementById('q').value=q;}
  if(Q.get('theme'))document.documentElement.setAttribute('data-theme',Q.get('theme'));
  draw();
})();
</script>
</body>
</html>
