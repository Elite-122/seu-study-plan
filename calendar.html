<style>
/* التقويم الأكاديمي: تبويبات الفصول، رحلة الفصل، مفتوح الحين، الجاي، كل المواعيد */
#najd .ac-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px;margin:0 0 14px;box-shadow:var(--shadow)}
#najd .ac-tabs button{position:relative;min-height:48px;border:0;border-radius:var(--r-md);background:none;font:inherit;font-weight:800;font-size:var(--fs-base);color:var(--muted);cursor:pointer;line-height:1.3;padding:4px 6px}
#najd .ac-tabs button[aria-selected="true"]{background:var(--deep);color:#fff}
#najd .ac-tabs button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#najd .ac-now{display:inline-block;margin-inline-start:6px;padding:1px 7px;border-radius:var(--r-pill);background:#D9B48A;color:#1F3837;font-size:12px;font-weight:800;vertical-align:2px}
#najd .ac-note{display:flex;align-items:center;gap:10px;background:var(--tint);border-radius:var(--r-md);padding:10px 12px;margin:0 0 14px;font-size:var(--fs-md);font-weight:700;color:var(--dtext)}
#najd .ac-note svg{width:20px;height:20px;flex-shrink:0}
#najd .ac-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:900px){#najd .ac-grid{grid-template-columns:minmax(0,1fr)}}
#najd .ac-col{display:grid;gap:16px;min-width:0}
/* رحلة الفصل */
#najd .ac-trip{border-radius:var(--r);background:linear-gradient(160deg,#2F4F4E 0%,#1F3837 100%);color:#fff;padding:16px 16px 12px;box-shadow:var(--shadow);overflow:hidden}
#najd .ac-trip-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#najd .ac-trip-h p{margin:0;font-size:var(--fs-sm);font-weight:700;color:#E2C9A6}
#najd .ac-trip-h h2{margin:2px 0 0;font-size:var(--fs-3xl);font-weight:800;color:#fff;line-height:1.3}
#najd .ac-trip-n{text-align:center;flex-shrink:0}
#najd .ac-trip-n b{display:block;font-size:34px;font-weight:800;line-height:1;color:#D9B48A}
#najd .ac-trip-n small{font-size:var(--fs-xs);font-weight:700;color:rgba(255,255,255,.8)}
#najd .ac-trip svg{display:block;width:100%;height:auto;margin-top:6px}
#najd .ac-trip-now{margin:8px 0 0;padding:7px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.1);font-size:var(--fs-sm);font-weight:700;color:#fff}
#najd .ac-trip-now b{color:#E2C9A6;font-weight:800}
#najd .ac-trip-k{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;font-size:12px;color:rgba(255,255,255,.85)}
#najd .ac-trip-k i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* الأقسام */
#najd .ac-sec{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
#najd .ac-sec>h2{display:flex;align-items:center;gap:8px;font-size:var(--fs-lg);font-weight:800;margin:0 0 10px;line-height:1.4}
#najd .ac-sec>h2>svg{width:20px;height:20px;flex-shrink:0;color:var(--teal)}
#najd .ac-sec>h2 small{margin-inline-start:auto;font-size:var(--fs-sm);color:var(--slate);font-weight:700}
#najd .ac-empty{margin:0;font-size:var(--fs-md);color:var(--muted)}
/* مفتوح الحين */
#najd .ac-open{display:grid;gap:8px}
#najd .ao{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--bg);border-inline-start:4px solid var(--c)}
#najd .ao-n{flex-shrink:0;min-width:54px;text-align:center}
#najd .ao-n b{display:block;font-size:26px;font-weight:800;line-height:1;color:var(--ink)}
#najd .ao-n small{font-size:12px;font-weight:700;color:var(--slate)}
#najd .ao.is-hot .ao-n b{color:var(--err)}
#najd .ao>div:nth-child(2){flex:1;min-width:0}
#najd .ao b.t{display:block;font-size:var(--fs-base);font-weight:800;line-height:1.45}
#najd .ao small.w{display:block;font-size:var(--fs-sm);color:var(--slate);margin-top:2px}
#najd .ao-bar{height:5px;border-radius:5px;background:var(--light);margin-top:7px;overflow:hidden}
#najd .ao-bar i{display:block;height:100%;background:var(--c);border-radius:inherit}
/* إعلان العمادة */
#najd .ac-ann{position:relative;display:inline-flex;align-items:center;gap:4px;min-height:28px;margin-top:5px;padding:0 10px;border-radius:var(--r-pill);background:#F3E6D2;color:#6E4F22;font-size:12px;font-weight:800;text-decoration:none;line-height:1.2}
#najd .ac-ann::after{content:"";position:absolute;inset:-8px -4px}
#najd .ac-ann.is-ok{background:var(--tint);color:var(--dtext)}
#najd .ac-ann svg{width:13px;height:13px}
#najd .ac-ann:hover{text-decoration:underline;text-underline-offset:2px}
#najd .ac-was{display:block;font-size:12px;color:var(--slate);margin-top:3px}
#najd .ac-x{display:inline-block;margin-inline-start:6px;padding:0 7px;border-radius:var(--r-pill);background:var(--tint);color:var(--dtext);font-size:12px;font-weight:800;vertical-align:2px}
/* القائمة */
#najd .ac-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
#najd .ac-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px;flex:1 1 100%;min-width:0}
#najd .ac-chips::-webkit-scrollbar{display:none}
@media (min-width:900px){#najd .ac-chips{flex-wrap:wrap;overflow:visible}}
#najd .ac-chips button{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:var(--fs-sm);font-weight:800;color:var(--ink);cursor:pointer;transition:border-color var(--t-fast)}
#najd .ac-chips button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
#najd .ac-chips button small{font-size:12px;font-weight:700;color:var(--slate)}
#najd .ac-chips button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
#najd .ac-chips button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
#najd .ac-hj{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:700;color:var(--muted);margin-inline-start:auto;cursor:pointer}
#najd .ac-m{margin:14px 0 6px;font-size:var(--fs-sm);font-weight:800;color:var(--slate);display:flex;align-items:center;gap:8px}
#najd .ac-m::after{content:"";flex:1;height:1px;background:var(--line)}
#najd .ai{display:grid;grid-template-columns:52px 14px minmax(0,1fr) auto;gap:0 10px;align-items:start;padding:8px 0}
#najd .ai-d{text-align:center;padding-top:2px}
#najd .ai-d b{display:block;font-size:22px;font-weight:800;line-height:1;color:var(--ink)}
#najd .ai-d small{font-size:12px;font-weight:700;color:var(--slate)}
#najd .ai-l{position:relative;align-self:stretch;display:flex;justify-content:center}
#najd .ai-l::before{content:"";position:absolute;top:0;bottom:-8px;width:2px;background:var(--line)}
#najd .ai-l i{position:relative;margin-top:6px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--card)}
#najd .ai-t{min-width:0}
#najd .ai-t b{display:block;font-size:var(--fs-base);font-weight:700;line-height:1.55}
#najd .ai-t small{display:block;font-size:var(--fs-sm);color:var(--slate);margin-top:1px}
#najd .ai-s{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#najd .pill{white-space:nowrap;font-size:12px;font-weight:800;border-radius:var(--r-pill);padding:3px 9px}
#najd .pill.open{background:var(--ok-bg);color:var(--ok)}
#najd .pill.now{background:#F0DEDB;color:#7A3730}
#najd .pill.soon{background:#F3E6D2;color:#6E4F22}
#najd .pill.done{background:var(--light);color:var(--muted)}
#najd .pill.today{background:var(--deep);color:#fff}
#najd .ai-add{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);color:var(--dtext);cursor:pointer;padding:0}
#najd .ai-add svg{width:18px;height:18px}
#najd .ai-add:focus-visible,#najd .ac-chips button:focus-visible,#najd .ac-past:focus-visible,#najd .ac-ann:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#najd .ai.is-done .ai-t b,#najd .ai.is-done .ai-d b{color:var(--muted)}
#najd .ai.is-done .ai-l i{opacity:.45}
#najd .ac-past{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin:4px 0 0;border:1.5px dashed var(--line);border-radius:var(--r-md);background:none;font:inherit;font-weight:800;color:var(--muted);cursor:pointer}
#najd .ac-past svg{width:18px;height:18px}
#najd .ac-all{width:100%;margin-top:12px}
#najd .ac-src{font-size:var(--fs-sm);color:var(--slate);text-align:center;margin:18px auto 0;max-width:46em;line-height:1.8}
#najd .ac-src a{color:var(--dtext);font-weight:700;text-decoration:underline;text-underline-offset:3px}
#najd .ac-list:focus{outline:none}
html[data-theme="dark"] #najd .pill.soon,html[data-theme="dark"] #najd .ac-ann{background:#3A3122;color:#E7C79A}
html[data-theme="dark"] #najd .pill.now{background:#3A1F1C;color:#F2C7C1}
html[data-theme="dark"] #najd .ac-ann.is-ok{background:var(--tint);color:var(--dtext)}
@media (max-width:420px){#najd .ai{grid-template-columns:44px 12px minmax(0,1fr) auto;gap:0 8px}#najd .ac-tabs button{font-size:var(--fs-md)}}
</style>

<p class="nj-band-sub">التقويم الرسمي للجامعة بكل مواعيده، مع آخر إعلانات العمادة. وتقدر تضيف أي موعد لتقويم جوالك.</p>

<script>
/* التقويم الرسمي (assets/js/seu-calendar.js) هو الأساس، ومواعيد لوحة الإدارة تنضاف عليه بعلامة «من نجد».
   يفتح على الفصل اللي اليوم داخله، وإلا أقرب فصل جاي، وإلا آخر فصل. */
(function(){
  var N=window.Najd,esc=N.esc,EN=document.documentElement.lang==='en',root=document.getElementById('ac-app');
  function L(a,e){return EN?e:a;}
  var DATA=window.NAJD_SEU_CAL;
  if(!DATA||!DATA.sem){root.innerHTML='<div class="nj-card nj-empty"><b>'+L('ما قدرنا نحمّل التقويم','We couldn\'t load the calendar')+'</b><p>'+L('حدّث الصفحة.','Refresh the page.')+'</p></div>';return;}
  var ORDER=['first','second','summer'],NAMES={first:L('الأول','First'),second:L('الثاني','Second'),summer:L('الصيفي','Summer')};
  var CAT={exam:[L('الاختبارات','Exams'),'#B0625A'],off:[L('الإجازات','Holidays'),'#6E8F5E'],reg:[L('التسجيل والرسوم','Registration & fees'),'#4F7CA8'],req:[L('الطلبات والخدمات','Requests & services'),'#B08A4E'],key:[L('البداية والنهاية','Start & end'),'var(--teal)'],najd:[L('من نجد','From Najd'),'#7A5BA6']};
  var FORDER=['all','exam','off','reg','req','key','najd'];
  var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var IC={add:SV+'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>',
    list:SV+'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
    info:SV+'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>',
    down:SV+'<path d="M6 9l6 6 6-6"/></svg>'};
  function p2(n){return (n<10?'0':'')+n;}
  function ymdOf(t){return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate());}
  var TODAY=ymdOf(new Date());
  function D(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function days(a,b){return Math.round((D(b)-D(a))/864e5);}
  var LOC=EN?'en-GB':'ar-SA-u-ca-gregory-nu-latn';
  function fmt(o,loc){try{return new Intl.DateTimeFormat(loc||LOC,o);}catch(e){return new Intl.DateTimeFormat('en-GB',o);}}
  var F={d:fmt({day:'numeric',month:'long'}),dy:fmt({day:'numeric',month:'long',year:'numeric'}),w:fmt({weekday:'long'}),ws:fmt({weekday:'short'}),m:fmt({month:'long',year:'numeric'}),mo:fmt({month:'short'})};
  var HF=null;try{HF=new Intl.DateTimeFormat(EN?'en-GB-u-ca-islamic-umalqura':'ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'});}catch(e){}
  var HM={'محرم':'Muharram','صفر':'Safar','ربيع الأول':'Rabi I','ربيع الآخر':'Rabi II','جمادى الأولى':'Jumada I','جمادى الآخرة':'Jumada II','رجب':'Rajab','شعبان':'Shaban','رمضان':'Ramadan','شوال':'Shawwal','ذو القعدة':'Dhu al-Qadah','ذو الحجة':'Dhu al-Hijjah'};
  function hTxt(h){return EN?h.replace(/^(\d+) (.+) (\d{4})$/,function(_,d,m,y){return d+' '+(HM[m]||m)+' '+y;}):h;}
  function hCalc(s){if(!HF)return '';try{return HF.format(D(s)).replace(/\s*(هـ|AH)\s*$/,'');}catch(e){return '';}}
  function fd(s){return F.d.format(D(s));}
  function pl(n,one,two,few,many){return n===1?one:n===2?two:(n>=3&&n<=10?n+' '+few:n+' '+many);}
  function dWord(n){return EN?(n===1?'day':'days'):(n>=3&&n<=10?'أيام':'يوم');}
  function inDays(n){return EN?(n===0?'Today':n===1?'Tomorrow':'In '+n+' days'):(n===0?'اليوم':n===1?'بكرة':'بعد '+pl(n,'يوم','يومين','أيام','يوم'));}
  function left(n){return EN?(n===0?'last day':n+' '+dWord(n)+' left'):(n===0?'آخر يوم':'باقي '+pl(n,'يوم','يومين','أيام','يوم'));}
  function tt(x){return EN&&x.en?x.en:x.t;}
  function act(x){return (x.c==='req'||x.c==='reg')&&!x.z;}

  /* البيانات: نسخة من الرسمي + مواعيد الإدارة */
  var SEM={},SPAN={},EXTRA=[];
  function span(items){var a='9999',b='0000';items.forEach(function(x){if(x.x)return;if(x.d<a)a=x.d;var e=x.e||x.d;if(e>b)b=e;});return {a:a,b:b};}
  ORDER.forEach(function(k){var s=DATA.sem[k];if(s&&s.items&&s.items.length)SPAN[k]=span(s.items);});
  var ADMIN={reg:'reg',add:'reg',exam:'exam',holiday:'off'};
  function home(x){var best=null,bd=1e9;ORDER.forEach(function(k){var r=SPAN[k];if(!r)return;var dd=x.d<r.a?days(x.d,r.a):x.d>r.b?days(r.b,x.d):0;if(dd<bd||(dd===bd&&best&&r.a>SPAN[best].a)){bd=dd;best=k;}});return best;}
  function build(){
    ORDER.forEach(function(k){var s=DATA.sem[k];if(!s||!SPAN[k])return;SEM[k]={name:s.name,items:s.items.slice()};});
    EXTRA.forEach(function(x){var k=home(x);if(k)SEM[k].items.push(x);});
    ORDER.forEach(function(k){if(SEM[k])SEM[k].items.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:((a.e||a.d)<(b.e||b.d)?-1:1);});});
  }
  function status(x){var e=x.e||x.d;if(TODAY<x.d)return {k:'soon',n:days(TODAY,x.d)};if(TODAY>e)return {k:'done'};if(!x.e||x.e===x.d)return {k:'today'};return {k:'open',n:days(TODAY,x.e)};}
  function pick(){var inn=[],next=null,last=null;
    ORDER.forEach(function(k){var r=SPAN[k];if(!r)return;if(TODAY>=r.a&&TODAY<=r.b)inn.push(k);if(r.a>TODAY&&(!next||r.a<SPAN[next].a))next=k;if(!last||r.b>SPAN[last].b)last=k;});
    if(inn.length){inn.sort(function(a,b){return SPAN[a].a<SPAN[b].a?1:-1;});return {k:inn[0],live:true};}
    return next?{k:next,live:true}:{k:last,live:false};}

  var Q=new URLSearchParams(location.search),cur,sel,moved=null,flt='all',showPast=false,hij=false;
  try{hij=localStorage.getItem('najd_cal_hijri')==='1';}catch(e){}
  function start(){
    cur=pick();sel=SPAN[Q.get('sem')]?Q.get('sem'):cur.k;
    /* نقلناك تلقائي: آخر فصل شافه الطالب خلص، والحين فصل ثاني */
    try{var last=localStorage.getItem('najd_cal_sem');if(last&&last!==cur.k&&SPAN[last]&&SPAN[last].b<TODAY&&!Q.get('sem'))moved=last;localStorage.setItem('najd_cal_sem',cur.k);}catch(e){}
  }

  function ann(x){
    if(!x.a)return '';var k=x.a.k,t=k==='ext'?L('مدّدته العمادة','Extended by the deanship'):k==='chg'?L('عدّلته العمادة','Changed by the deanship'):L('إعلان العمادة','Deanship notice');
    var w=x.a.w&&k!=='ok'?'<small class="ac-was">'+L('كان في التقويم: ','Calendar said: ')+fd(x.a.w.d)+(x.a.w.e?' – '+fd(x.a.w.e):'')+'</small>':'';
    return '<a class="ac-ann is-'+k+'" href="'+esc(x.a.u)+'" target="_blank" rel="noopener">'+t+N.icon('ext')+'<span class="nj-sr">'+L(' (يفتح موقع الجامعة)',' (opens the university site)')+'</span></a>'+w;
  }
  function when(x){
    if(hij){var a=x.h?hTxt(x.h):hCalc(x.d),b=x.e?(x.he?hTxt(x.he):hCalc(x.e)):'';if(a)return a+(b?' – '+b:'')+L(' هـ',' AH');}
    if(x.e)return EN?F.ws.format(D(x.d))+' '+fd(x.d)+' – '+F.ws.format(D(x.e))+' '+fd(x.e):'من '+F.ws.format(D(x.d))+' '+fd(x.d)+' لين '+F.ws.format(D(x.e))+' '+fd(x.e);
    return F.w.format(D(x.d))+' '+fd(x.d);
  }
  function pill(x){var s=x.s;
    if(s.k==='open')return act(x)?'<span class="pill open">'+L('مفتوح','Open')+' · '+left(s.n)+'</span>':'<span class="pill now">'+(x.z?L('مقفل','Closed'):L('جاري','On now'))+' · '+left(s.n)+'</span>';
    if(s.k==='soon')return '<span class="pill soon">'+inDays(s.n)+'</span>';

    return '<span class="pill done">'+L('انتهى','Ended')+'</span>';}
  function row(x){
    var d=D(x.d);
    return '<div class="ai'+(x.s.k==='done'?' is-done':'')+'" style="--c:'+CAT[x.c][1]+'"><div class="ai-d"><b>'+d.getDate()+'</b><small>'+F.mo.format(d)+'</small></div><div class="ai-l"><i></i></div>'
      +'<div class="ai-t"><b>'+esc(tt(x))+(x.x?'<span class="ac-x">'+L('من نجد','From Najd')+'</span>':'')+'</b><small>'+when(x)+'</small>'+(x.n?'<small>'+esc(x.n)+'</small>':'')+ann(x)+'</div>'
      +'<div class="ai-s">'+pill(x)+(x.s.k!=='done'?'<button type="button" class="ai-add" data-add="'+esc(x.id)+'" aria-label="'+esc(L('أضف لتقويم جوالك: ','Add to your phone calendar: ')+tt(x))+'">'+IC.add+'</button>':'')+'</div></div>';
  }
  function months(list){var o='',lm='';list.forEach(function(x){var m=F.m.format(D(x.d));if(m!==lm){o+='<p class="ac-m">'+m+'</p>';lm=m;}o+=row(x);});return o;}

  /* شريط الفصل: البداية من جهة القراءة، والاختبارات مرتفعات، والإجازات أخضر، واليوم نقطة رمل */
  function tripSvg(items,s0,s1){
    var W=340,base=60,tot=Math.max(1,days(s0,s1));
    function X(d){var f=Math.max(0,Math.min(1,days(s0,d)/tot));return EN?8+(W-16)*f:W-8-(W-16)*f;}
    var o='<svg viewBox="0 0 '+W+' 92" aria-hidden="true"><rect x="8" y="'+(base-3)+'" width="'+(W-16)+'" height="6" rx="3" fill="rgba(255,255,255,.18)"/>';
    var tx=X(TODAY),x0=X(s0);o+='<rect x="'+Math.min(tx,x0)+'" y="'+(base-3)+'" width="'+Math.abs(x0-tx)+'" height="6" rx="3" fill="#D9B48A"/>';
    items.forEach(function(x){if(x.c==='off'&&x.e&&!x.x){var a=X(x.d),b=X(x.e);o+='<rect x="'+Math.min(a,b)+'" y="'+(base-3)+'" width="'+Math.max(4,Math.abs(a-b))+'" height="6" rx="3" fill="#8FB98A"/>';}});
    items.forEach(function(x){if(x.c==='exam'&&x.e&&!x.x&&!/السنة الأولى|البديلة/.test(x.t)&&x.d>=s0&&x.e<=s1){var a=X(x.d),b=X(x.e),m=(a+b)/2,lb=/النهائية/.test(x.t)?L('النهائية','Finals'):/الفصلية/.test(x.t)?L('الفصلية','Midterms'):L('اختبارات','Exams');
      o+='<path d="M'+a+' '+(base-3)+' L'+m+' '+(base-30)+' L'+b+' '+(base-3)+'Z" fill="#B0625A" opacity=".92"/><text x="'+m+'" y="'+(base-36)+'" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="12" font-weight="800" fill="#fff">'+lb+'</text>';}});
    o+='<line x1="'+tx+'" y1="'+(base-14)+'" x2="'+tx+'" y2="'+(base+10)+'" stroke="#fff" stroke-width="2"/><circle cx="'+tx+'" cy="'+base+'" r="7" fill="#fff" stroke="#D9B48A" stroke-width="3"/>';
    var sa=EN?38:W-38,sb=EN?W-38:38;
    o+='<text x="'+sa+'" y="'+(base+24)+'" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="12" fill="rgba(255,255,255,.85)">'+fd(s0)+'</text><text x="'+sb+'" y="'+(base+24)+'" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="12" fill="rgba(255,255,255,.85)">'+fd(s1)+'</text>';
    return o+'</svg>';
  }

  function draw(){
    var s=SEM[sel],r=SPAN[sel],items=s.items;items.forEach(function(x){x.s=status(x);});
    var o='<div class="ac-tabs" role="tablist" aria-label="'+L('فصول السنة','Semesters')+'">'+ORDER.filter(function(k){return SEM[k];}).map(function(k){var on=k===sel;
      return '<button type="button" role="tab" id="ac-tab-'+k+'" aria-controls="ac-panel" aria-selected="'+on+'" tabindex="'+(on?0:-1)+'" data-sem="'+k+'">'+NAMES[k]+(k===cur.k&&cur.live?'<span class="ac-now">'+L('الحين','Now')+'</span>':'')+'</button>';}).join('')+'</div>';
    o+='<div id="ac-panel" role="tabpanel" aria-labelledby="ac-tab-'+sel+'">';
    if(moved&&sel===cur.k)o+='<div class="ac-note" role="status">'+IC.info+'<span>'+(EN?'The '+NAMES[moved].toLowerCase()+' semester is over, so we moved you to the '+NAMES[cur.k].toLowerCase()+' semester.':'خلص الفصل '+NAMES[moved]+'، ونقلناك لتقويم الفصل '+NAMES[cur.k]+'.')+'</span></div>';
    if(TODAY>r.b)o+='<div class="ac-note">'+IC.info+'<span>'+L('انتهى هذا الفصل في ','This semester ended on ')+F.dy.format(D(r.b))+'.'+(sel==='summer'&&cur.live?L(' الصيفي الجاي ينزل مع تقويم السنة الجاية.',' The next summer term comes with next year\'s calendar.'):!cur.live?L(' نضيف تقويم السنة الجاية أول ما تنشره الجامعة.',' We\'ll add next year\'s calendar as soon as the university publishes it.'):'')+'</span></div>';
    /* رحلة الفصل */
    var st=(items.filter(function(x){return !x.x&&/^بداية الدراسة/.test(x.t);})[0]||{d:r.a}).d,en=r.b,tot=Math.max(1,days(st,en));
    var wk=Math.floor(days(st,TODAY)/7)+1,wks=Math.ceil(tot/7),rem=days(TODAY,en);
    var h2=TODAY<st?(EN?'Starts '+inDays(days(TODAY,st)).toLowerCase():'يبدأ '+inDays(days(TODAY,st))):TODAY>en?L('انتهى الفصل','Semester over'):(EN?'Week '+wk+' of '+wks:'الأسبوع '+wk+' من '+wks);
    var going=items.filter(function(x){return x.s.k==='open'&&!act(x);});
    var trip='<section class="ac-trip" aria-label="'+L('رحلة الفصل','Semester journey')+'"><div class="ac-trip-h"><div><p>'+L('رحلة الفصل ','Semester journey · ')+NAMES[sel]+'</p><h2>'+h2+'</h2></div>'
      +(TODAY>=st&&TODAY<=en?'<div class="ac-trip-n"><b>'+rem+'</b><small>'+(EN?dWord(rem)+' to go':dWord(rem)+' على النهاية')+'</small></div>':'')+'</div>'+tripSvg(items,st,en)
      +going.map(function(x){return '<p class="ac-trip-now"><b>'+L('الحين: ','Now: ')+'</b>'+esc(tt(x))+' · '+left(x.s.n)+'</p>';}).join('')
      +'<div class="ac-trip-k" aria-hidden="true"><span><i style="background:#B0625A"></i>'+L('اختبارات','Exams')+'</span><span><i style="background:#8FB98A"></i>'+L('إجازات','Holidays')+'</span><span><i style="background:#D9B48A"></i>'+L('اليوم','Today')+'</span></div></section>';
    /* مفتوح الحين */
    var open=items.filter(function(x){return x.s.k==='open'&&act(x);}).sort(function(a,b){return a.s.n-b.s.n;});
    var openH='<section class="ac-sec" aria-labelledby="ac-open-h"><h2 id="ac-open-h">'+N.icon('clock')+L('مفتوح الحين','Open now')+(open.length?'<small>'+(EN?open.length+(open.length===1?' request':' requests'):pl(open.length,'طلب واحد','طلبين','طلبات','طلب'))+'</small>':'')+'</h2>'
      +(open.length?'<div class="ac-open">'+open.map(function(x){var all=Math.max(1,days(x.d,x.e)),dn=days(x.d,TODAY),n=x.s.n;
        return '<div class="ao'+(n<=3?' is-hot':'')+'" style="--c:'+CAT[x.c][1]+'"><div class="ao-n"><b>'+n+'</b><small>'+(n===0?L('آخر يوم','last day'):dWord(n))+'</small></div><div><b class="t">'+esc(tt(x))+'</b><small class="w">'+L('يقفل ','Closes ')+F.w.format(D(x.e))+' '+fd(x.e)+'</small>'+ann(x)+'<div class="ao-bar" aria-hidden="true"><i style="width:'+Math.round(dn/all*100)+'%"></i></div></div></div>';}).join('')+'</div>'
        :'<p class="ac-empty">'+L('ما فيه طلب مفتوح الحين في هذا الفصل.','Nothing is open right now in this semester.')+'</p>')+'</section>';
    /* الجاي */
    var soon=items.filter(function(x){return x.s.k==='soon'||x.s.k==='today';}).slice(0,3);
    var soonH='<section class="ac-sec" aria-labelledby="ac-soon-h"><h2 id="ac-soon-h">'+N.icon('calendar')+L('الجاي','Coming up')+'</h2>'+(soon.length?soon.map(row).join(''):'<p class="ac-empty">'+L('ما فيه مواعيد جاية في هذا الفصل.','No more dates this semester.')+'</p>')+'</section>';
    /* كل المواعيد */
    var cnt={all:items.length};items.forEach(function(x){cnt[x.c]=(cnt[x.c]||0)+1;});if(!cnt[flt])flt='all';
    var list=items.filter(function(x){return flt==='all'||x.c===flt;}),past=list.filter(function(x){return x.s.k==='done';}),rest=list.filter(function(x){return x.s.k!=='done';});
    var up=rest.length;
    var allH='<section class="ac-sec" aria-labelledby="ac-all-h"><h2 id="ac-all-h">'+IC.list+L('كل المواعيد','All dates')+'<small>'+items.length+'</small></h2><div class="ac-tools"><div class="ac-chips" role="group" aria-label="'+L('نوع الموعد','Type')+'">'
      +FORDER.filter(function(k){return k==='all'||cnt[k];}).map(function(k){return '<button type="button" data-f="'+k+'" aria-pressed="'+(flt===k)+'"'+(k!=='all'?' style="--c:'+CAT[k][1]+'"':'')+'>'+(k!=='all'?'<i></i>':'')+(k==='all'?L('الكل','All'):CAT[k][0])+' <small>'+cnt[k]+'</small></button>';}).join('')+'</div>'
      +'<label class="ac-hj"><input type="checkbox" class="nj-switch" data-hj'+(hij?' checked':'')+'>'+L('التاريخ الهجري','Hijri dates')+'</label></div>'
      +'<div class="ac-list" id="ac-list" tabindex="-1">'
      +(past.length&&!showPast?'<button type="button" class="ac-past" data-past aria-expanded="false">'+IC.down+L('اللي انتهى','Ended')+' ('+past.length+')</button>':'')
      +months((showPast?past:[]).concat(rest))+'</div>'
      +(up?'<button type="button" class="nj-btn nj-btn-line ac-all" data-all>'+IC.add+(EN?'Add '+(up===1?'the upcoming date':'the '+up+' upcoming dates')+' to your phone calendar':'أضف '+(up===1?'الموعد الجاي':pl(up,'','الموعدين الجايين','مواعيد جاية','موعد جاي'))+' لتقويم جوالك')+'</button>':'')+'</section>';
    o+='<div class="ac-grid"><div class="ac-col">'+trip+openH+soonH+'</div><div class="ac-col">'+allH+'</div></div></div>';
    o+='<p class="ac-src">'+L('المصدر: ','Source: ')+'<a href="'+esc(DATA.src)+'" target="_blank" rel="noopener">'+L('التقويم الأكاديمي الرسمي','the official academic calendar')+' '+DATA.year+L('هـ',' AH')+'</a>'+(DATA.ann?L(' و',' and ')+'<a href="'+esc(DATA.ann)+'" target="_blank" rel="noopener">'+L('إعلانات عمادة القبول والتسجيل','Admission and Registration announcements')+'</a>':'')
      +L('. لو اختلف موعد، المعتمد هو موقع الجامعة.','. If a date differs, the university site is the reference.')+'</p>';
    root.innerHTML=o;
  }
  function byId(id){var l=[];ORDER.forEach(function(k){if(SEM[k])l=l.concat(SEM[k].items);});for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}

  /* ملف التقويم: حدث يوم كامل لكل موعد، وتنبيه قبله بيوم ٩ الصبح، والطلبات تنبيه ثاني قبل ما تقفل بيوم */
  function ie(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
  function ymd(d){return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate());}
  function fold(l){var out='',n=0;for(var i=0;i<l.length;i++){var ch=l[i],cp=l.charCodeAt(i);if(cp>=0xD800&&cp<=0xDBFF&&i+1<l.length){ch+=l[++i];}var c2=ch.codePointAt(0),b=c2<128?1:c2<2048?2:c2<65536?3:4;if(n+b>74){out+='\r\n ';n=1;}out+=ch;n+=b;}return out;}
  function ics(list){
    var t=new Date(),stamp=t.getUTCFullYear()+p2(t.getUTCMonth()+1)+p2(t.getUTCDate())+'T'+p2(t.getUTCHours())+p2(t.getUTCMinutes())+'00Z';
    var o=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Najd Academy//Academic Calendar//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+ie(L('التقويم الأكاديمي','Academic calendar'))];
    list.forEach(function(x){var e=D(x.e||x.d);e.setDate(e.getDate()+1);
      var desc=(x.n?x.n+'\n':'')+(x.a?L('إعلان العمادة: ','Deanship notice: ')+x.a.u+'\n':'')+(x.x?L('من أكاديمية نجد','From Najd Academy'):L('من التقويم الأكاديمي الرسمي. أكاديمية نجد','From the official academic calendar. Najd Academy'));
      o.push('BEGIN:VEVENT','UID:najd-'+DATA.year+'-'+x.id+'@najdacdemy.com','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+ymd(D(x.d)),'DTEND;VALUE=DATE:'+ymd(e),'SUMMARY:'+ie(tt(x)),'DESCRIPTION:'+ie(desc),'TRANSP:TRANSPARENT');
      if(x.a)o.push('URL:'+x.a.u);
      o.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie(tt(x)),'TRIGGER:-PT15H','END:VALARM');
      if(x.e&&act(x)){var c=D(x.e);c.setDate(c.getDate()-1);if(ymd(c)>ymd(D(x.d)))o.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie(L('يقفل بكرة: ','Closes tomorrow: ')+tt(x)),'TRIGGER;VALUE=DATE-TIME:'+ymd(c)+'T060000Z','END:VALARM');}
      o.push('END:VEVENT');});
    o.push('END:VCALENDAR');return o.map(fold).join('\r\n')+'\r\n';
  }
  function save(list,name){
    var how=N.calendar(ics(list),name),one=list.length===1;
    N.toast(how==='open'?(one?L('بيطلع لك الموعد: اضغط «إضافة»، وينضاف مع التنبيه.','Your calendar opens next: tap Add to save it with a reminder.'):L('بيطلع لك التقويم: اضغط «إضافة الكل»، وتنضاف المواعيد مع التنبيهات.','Your calendar opens next: tap Add All to save the dates with reminders.'))
      :how==='share'?L('اختر «التقويم» من نافذة المشاركة.','Choose Calendar in the share sheet.')
      :L('تم تحميل ملف التقويم. افتحه وبتنضاف المواعيد لتقويمك.','Calendar file downloaded. Open it to add the dates to your calendar.'));
  }

  /* التفاعل */
  function refocus(sel2){var el=sel2&&root.querySelector(sel2);if(el)el.focus();}
  root.addEventListener('click',function(e){
    var b=e.target.closest('[data-sem],[data-f],[data-past],[data-add],[data-all]');if(!b)return;
    if(b.hasAttribute('data-add')){var x=byId(b.getAttribute('data-add'));if(x)save([x],'najd-'+x.id+'.ics');return;}
    if(b.hasAttribute('data-all')){var l=SEM[sel].items.filter(function(x){return x.s.k!=='done'&&(flt==='all'||x.c===flt);});if(l.length)save(l,'najd-calendar-'+sel+'.ics');return;}
    var f=null;
    if(b.hasAttribute('data-sem')){var k=b.getAttribute('data-sem');if(k===sel)return;sel=k;flt='all';showPast=false;moved=null;f='#ac-tab-'+k;}
    else if(b.hasAttribute('data-f')){flt=b.getAttribute('data-f');f='[data-f="'+flt+'"]';}
    else if(b.hasAttribute('data-past')){showPast=true;f='#ac-list';}
    draw();refocus(f);
  });
  root.addEventListener('change',function(e){if(!e.target.hasAttribute('data-hj'))return;hij=e.target.checked;try{localStorage.setItem('najd_cal_hijri',hij?'1':'0');}catch(x){}draw();refocus('[data-hj]');});
  root.addEventListener('keydown',function(e){
    var t=e.target.closest('[role="tab"]');if(!t)return;var tabs=[].slice.call(root.querySelectorAll('[role="tab"]')),i=tabs.indexOf(t),rtl=getComputedStyle(root).direction==='rtl',j=-1;
    if(e.key==='ArrowLeft')j=i+(rtl?1:-1);else if(e.key==='ArrowRight')j=i+(rtl?-1:1);else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;else return;
    e.preventDefault();j=(j+tabs.length)%tabs.length;tabs[j].click();
  });
  /* لو بقت الصفحة مفتوحة لليوم الثاني */
  document.addEventListener('visibilitychange',function(){if(document.hidden)return;var t=ymdOf(new Date());if(t!==TODAY){TODAY=t;var was=cur.k;cur=pick();if(sel===was&&was!==cur.k)sel=cur.k;draw();}});

  build();start();draw();
  window.NajdCal={
    /* مواعيد لوحة الإدارة (مجموعة calendar): ورشة، تنبيه، أو موعد ناقص */
    extras:function(list){
      EXTRA=(list||[]).filter(function(x){return x&&x.active!==false&&typeof x.title==='string'&&x.title.trim()&&/^\d{4}-\d{2}-\d{2}$/.test(x.date||'');}).map(function(x){
        var e=/^\d{4}-\d{2}-\d{2}$/.test(x.end||'')&&x.end>x.date?x.end:null,o={id:'x-'+String(x.id||'').replace(/[^\w-]/g,''),t:x.title.trim().slice(0,160),c:ADMIN[x.type]||'najd',d:x.date,x:1};
        if(e)o.e=e;if(x.notes)o.n=String(x.notes).slice(0,300);return o;});
      build();if(!SEM[sel])sel=cur.k;draw();
    }
  };
})();

<script type="module">
try {
  const { db } = await import("./assets/js/auth.js?v=202611170200");
