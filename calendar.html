<style>
#najd .cl-wrap{max-width:860px}
#najd .cl-bar{display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:center;justify-content:space-between}
#najd .cl-tg{display:inline-flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-base);cursor:pointer}
#najd .cl-tg input{width:20px;height:20px;accent-color:var(--teal);margin:0}
#najd .cl-next{display:flex;align-items:center;gap:var(--sp-6);flex-wrap:wrap;background:linear-gradient(150deg,var(--deep),var(--deeper));color:#fff;border:0}
#najd .cl-next b{font-size:34px;font-weight:800;line-height:1}
#najd .cl-next small{display:block;color:var(--mist);font-size:var(--fs-md)}
#najd .cl-next h2{color:#fff;font-size:var(--fs-xl)}
#najd .cl-mh{font-size:var(--fs-2xl);font-weight:800;margin:22px 0 10px}
#najd .cl-ev{display:flex;gap:var(--sp-6);align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;margin:0 0 8px;box-shadow:var(--shadow)}
#najd .cl-ev.is-past{opacity:.55}
#najd .cl-d{flex-shrink:0;width:62px;text-align:center;border-radius:var(--r-md);background:var(--tint);padding:6px 4px;direction:ltr}
#najd .cl-d b{display:block;font-size:var(--fs-3xl);font-weight:800;line-height:1.1;color:var(--dtext)}
#najd .cl-d small{font-size:var(--fs-xs);font-weight:700;color:var(--slate)}
#najd .cl-ev h3{font-size:var(--fs-lg);font-weight:800;line-height:1.4}
#najd .cl-ev p{font-size:var(--fs-md);color:var(--muted)}
#najd .cl-ev>div:nth-child(2){flex:1;min-width:0}
#najd .cl-left{flex-shrink:0;font-size:var(--fs-sm);font-weight:800;color:var(--link);white-space:nowrap}
#najd .cl-note{font-size:var(--fs-md);color:var(--slate);text-align:center;margin:18px 0 0}

<body>
<div id="najd" dir="rtl" data-page="calendar">
<div id="nj-header"></div>
<section class="nj-band">
<svg class="nj-band-mark" viewBox="14 20 92 84" aria-hidden="true"><path d="M26 48 L36 36 L46 48 Z" fill="#758A8C"/><path d="M50 48 L60 30 L70 48 Z" fill="#7A9FA3"/><path d="M74 48 L84 24 L94 48 Z" fill="#C8CFD2"/><path d="M58 100 L18 88 V56 L58 68 Z" fill="#C8CFD2"/><path d="M62 100 L102 88 V56 L62 68 Z" fill="#E4E9EB"/></svg>
<div class="nj-in">
<p class="nj-crumb"><a href="index.html">الرئيسية</a><span>/</span>التقويم الأكاديمي</p>
<h1>التقويم الأكاديمي</h1>
<p class="nj-band-sub">مواعيد التسجيل والحذف والإضافة والاختبارات والإجازات، في مكان واحد. وتقدر تضيفها لتقويم جوالك.</p>
</div>
</section>
<main class="nj-main">
<div class="nj-in cl-wrap">
<div class="nj-card cl-next" id="cl-next" hidden></div>
<div class="nj-card">
<div class="cl-bar">
<div class="nj-chips cl-chips" id="cl-chips" role="group" aria-label="نوع الموعد"></div>
<label class="cl-tg"><input type="checkbox" id="cl-past">إظهار المواعيد السابقة</label>
</div>
<div style="margin-top:14px"><button type="button" class="nj-btn nj-btn-fill" id="cl-ics"><svg class="nj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>أضف المواعيد لتقويم جوالك</button></div>
</div>
<div id="cl-list"><div class="nj-card nj-empty"><p>جاري التحميل…</p></div></div>
<p class="cl-note">المواعيد مجمّعة لتسهيل المتابعة. المرجع الرسمي هو التقويم الأكاديمي المعتمد من الجامعة.</p>
</div>
</main>
<div id="nj-footer"></div>
</div>

<script>
(function(){
  var esc=window.Najd.esc,$=function(id){return document.getElementById(id);};
  function T(s){return window.NajdT?window.NajdT(s):s;}
  var TYPES={reg:'التسجيل',add:'الحذف والإضافة',exam:'الاختبارات',holiday:'الإجازات',other:'أخرى'};
  var all=null,type='',past=false;
  function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
  function D(s){return new Date(s+'T00:00:00');}
  function left(x){return Math.round((D(x.date)-today())/864e5);}
  function isPast(x){return D(x.end||x.date)<today();}
  function leftTxt(n){return n<0?'':n===0?'اليوم':n===1?'بكرة':n===2?'بعد يومين':'باقي '+n+(n<=10?' أيام':' يوم');}
  function range(x){var o={day:'numeric',month:'short'};var a=D(x.date).toLocaleDateString('en-GB',o);return x.end&&x.end!==x.date?a+' – '+D(x.end).toLocaleDateString('en-GB',o):a;}
  function view(){return all.filter(function(x){return (!type||x.type===type)&&(past||!isPast(x));});}
  function render(){
    if(!all)return;
    var used={};all.forEach(function(x){used[x.type||'other']=1;});
    var ch='<button type="button" class="nj-chip cl-chip" data-t="" aria-pressed="'+(!type)+'">الكل</button>';
    Object.keys(TYPES).forEach(function(k){if(used[k])ch+='<button type="button" class="nj-chip cl-chip" data-t="'+k+'" aria-pressed="'+(type===k)+'">'+TYPES[k]+'</button>';});
    $('cl-chips').innerHTML=ch;
    var up=all.filter(function(x){return !isPast(x)&&left(x)>=0;})[0],nx=$('cl-next');
    if(up){var n=left(up);nx.hidden=false;nx.innerHTML='<div><b>'+(n===0?window.Najd.icon('bell'):n)+'</b><small>'+(n===0?'اليوم':n===1?'يوم':n===2?'يومين':n<=10?'أيام':'يوم')+'</small></div><div><small>الموعد القادم</small><h2>'+esc(up.title)+'</h2><small dir="ltr">'+esc(range(up))+'</small></div>';}else nx.hidden=true;
    var l=view();
    if(!l.length){$('cl-list').innerHTML='<div class="nj-card nj-empty"><span class="nj-icon-xl">'+window.Najd.icon('calendar')+'</span><b>'+(all.length?'ما فيه مواعيد قادمة':'ما فيه مواعيد مضافة حاليًا')+'</b><p>'+(all.length?'فعّل «إظهار المواعيد السابقة» أو غيّر النوع.':'نضيف مواعيد الفصل أول ما تنعلن، ارجع لنا قريب.')+'</p></div>';return;}
    var o='',cur='';
    l.forEach(function(x){
      var d=D(x.date),mk=d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
      if(mk!==cur){cur=mk;o+='<h2 class="cl-mh" dir="ltr" style="text-align:start">'+mk+'</h2>';}
      var n=left(x),lt=isPast(x)?'':(n<0?'جاري الآن':leftTxt(n));
      o+='<article class="cl-ev'+(isPast(x)?' is-past':'')+'"><div class="cl-d"><b>'+d.getDate()+'</b><small>'+d.toLocaleDateString('en-GB',{month:'short'})+'</small></div>'
        +'<div><h3>'+esc(x.title)+'</h3><p>'+(x.end&&x.end!==x.date?'<span dir="ltr">'+esc(range(x))+'</span>'+(x.notes?' · ':''):'')+esc(x.notes||'')+'</p></div>'
        +(lt?'<span class="cl-left">'+lt+'</span>':'')+'<span class="nj-tag is-muted cl-tag">'+(TYPES[x.type]||TYPES.other)+'</span></article>';
    });
    $('cl-list').innerHTML=o;
  }
  $('cl-chips').addEventListener('click',function(e){var b=e.target.closest('.cl-chip');if(!b)return;type=b.getAttribute('data-t');render();});
  $('cl-past').addEventListener('change',function(){past=this.checked;render();});
  /* ملف تقويم (ICS) بأحداث يوم كامل */
  function pad(n){return (n<10?'0':'')+n;}
  function ymd(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}
  function ie(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
  $('cl-ics').addEventListener('click',function(){
    var l=(all||[]).filter(function(x){return !isPast(x)&&(!type||x.type===type);});
    if(!l.length){window.Najd.toast('ما فيه مواعيد قادمة نضيفها.');return;}
    var now=new Date(),st=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z';
    var o=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Najd Academy//Academic Calendar//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+ie(T('التقويم الأكاديمي'))];
    l.forEach(function(x){var e=D(x.end||x.date);e.setDate(e.getDate()+1);
      o.push('BEGIN:VEVENT','UID:najd-cal-'+x.id+'@najdacdemy.com','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+ymd(D(x.date)),'DTEND;VALUE=DATE:'+ymd(e),'SUMMARY:'+ie(T(x.title)),'DESCRIPTION:'+ie((x.notes?x.notes+' — ':'')+T('تذكير من أكاديمية نجد')),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie(T(x.title)),'TRIGGER:-P1D','END:VALARM','END:VEVENT');});
    o.push('END:VCALENDAR');var ics=o.join('\r\n');
    if(/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform))){window.location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);return;}
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='najd-calendar.ics';document.body.appendChild(a);a.click();a.remove();
    window.Najd.toast('تم تحميل ملف التقويم. افتحه وبتنضاف المواعيد لتقويمك.');
  });
  var done=false,ft=setTimeout(function(){window.NajdCal.fail();},15000);
  window.NajdCal={
    set:function(list){done=true;clearTimeout(ft);all=(list||[]).filter(function(x){return x&&x.title&&/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')&&x.active!==false;}).sort(function(a,b){return a.date.localeCompare(b.date);});render();},
    fail:function(){if(done)return;$('cl-list').innerHTML='<div class="nj-card nj-empty"><span class="nj-icon-xl">'+window.Najd.icon('offline')+'</span><b>ما قدرنا نجيب المواعيد</b><p>تأكد من اتصالك بالإنترنت وحدّث الصفحة.</p></div>';}
  };
})();
</script>
<script type="module">
try {
  const { db } = await import("./assets/js/auth.js?v=20261113g");
  const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js");
  const snap = await getDocs(collection(db, "calendar"));
  const list = []; snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
  window.NajdCal.set(list);
} catch (e) { console.warn("najd calendar", e); window.NajdCal.fail(); }
</script>
</body>
