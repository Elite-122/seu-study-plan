<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem("najd_theme")==="dark"?"dark":"light";d.setAttribute("data-theme",t);if(localStorage.getItem("najd_lang")==="en"){d.lang="en";d.dir="ltr";}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>إيقاف إيميلات التنبيه | أكاديمية نجد</title>
<meta name="theme-color" content="#2F4F4E">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="assets/img/mark.svg?v=202611230035" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نجد">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/najd.css?v=202611230035">
<style>
#najd .us{max-width:520px;margin:0 auto;padding:48px 0 24px}
#najd .us .nj-card{text-align:center;padding:32px 24px}
#najd .us-ic{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:var(--tint);color:var(--teal)}
#najd .us-ic svg{width:30px;height:30px}
#najd .us h1{font-size:var(--fs-3xl);font-weight:800;line-height:1.4;margin:0 0 8px}
#najd .us p{font-size:var(--fs-body);color:var(--muted);line-height:1.8;margin:0 auto;max-width:30em}
#najd .us-acts{display:flex;flex-direction:column;gap:var(--sp-3);margin:22px 0 0}
#najd .us-acts .nj-btn{width:100%}
</style>
</head>
<body>
<div id="najd" dir="rtl" data-page="unsubscribe">
<div id="nj-header"></div>
<main>
<div class="nj-in us" data-no-i18n>
<div class="nj-card" id="us" aria-live="polite"><p>…</p></div>
</div>
</main>
<div id="nj-footer"></div>
</div>
<script src="assets/js/layout.js?v=202611230035"></script>
<script src="assets/js/i18n.js?v=202611230035"></script>
<script type="module" src="assets/js/auth.js?v=202611230035"></script>
<script type="module">
/* رابط «إيقاف التنبيهات» من آخر إيميل التذكير: unsubscribe.html?u=<الحساب>&k=<المفتاح>
   نطلب ضغطة قبل الإيقاف، عشان برامج فحص الروابط في البريد ما توقفها بالغلط. */
const N = window.Najd, EN = document.documentElement.lang === "en", L = (a, e) => (EN ? e : a);
const box = document.getElementById("us"), q = new URLSearchParams(location.search);
const uid = q.get("u") || "", key = q.get("k") || "";
const ok = /^[A-Za-z0-9_-]{1,128}$/.test(uid) && /^[a-f0-9]{16,64}$/.test(key);
const view = (ic, h, p, acts) => {
  box.innerHTML = `<span class="us-ic">${N.icon(ic)}</span><h1>${h}</h1><p>${p}</p><div class="us-acts">${acts}</div>`;
};
const toSettings = `<a class="nj-btn nj-btn-fill" href="account.html#notify">${L("إعدادات التنبيهات", "Reminder settings")}</a>`;
const fail = () => view("bell", L("الرابط ما اشتغل", "This link didn't work"),
  L("يمكن الرابط قديم. تقدر توقف الإيميلات من «حسابي ← تنبيهاتي».", "The link may be old. You can turn emails off in My account → My reminders."), toSettings);

if (!ok) fail();
else {
  view("bell", L("توقف إيميلات التنبيه؟", "Stop reminder emails?"),
    L("ما راح توصلك إيميلات تذكير بالاختبارات والواجبات. إشعارات الجوال ما تتأثر، وتقدر ترجع الإيميلات متى ما تبي من حسابك.", "You won't get reminder emails about exams and homework. Phone notifications stay as they are, and you can turn emails back on anytime in your account."),
    `<button type="button" class="nj-btn nj-btn-fill" id="us-go">${L("أوقف الإيميلات", "Stop emails")}</button><a class="nj-btn nj-btn-line" href="index.html">${L("خلّها شغالة", "Keep them on")}</a>`);
  document.getElementById("us-go").onclick = async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = L("لحظة…", "One moment…");
    try {
      const { db } = await import("./assets/js/auth.js?v=202611230035");
      const { doc, updateDoc } = await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js");
      await updateDoc(doc(db, "users", uid), { "notify.email": false, "notify.unsub": key });
      view("check", L("أوقفنا إيميلات التنبيه", "Reminder emails are off"),
        L("ما راح توصلك إيميلات تذكير بعد اليوم. تقدر ترجعها من «حسابي ← تنبيهاتي».", "You won't get reminder emails anymore. Turn them back on in My account → My reminders."), toSettings);
    } catch (err) { console.warn("najd unsubscribe", err); fail(); }
  };
}
</script>
</body>
</html>
