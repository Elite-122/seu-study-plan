<style>
#najd .st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--sp-7)}
#najd .st-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform var(--t-base),box-shadow var(--t-base)}
#najd .st-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
#najd .st-img{aspect-ratio:4/3;background:linear-gradient(150deg,var(--tint),var(--light));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#najd .st-img img{width:100%;height:100%;object-fit:cover}
#najd .st-img svg{width:72px;height:72px}
#najd .st-badge{position:absolute;top:12px;right:12px}
#najd .st-body{padding:18px;display:flex;flex-direction:column;gap:var(--sp-3);flex:1}
#najd .st-body h3{font-size:var(--fs-xl);font-weight:800;line-height:1.4}
#najd .st-body p{font-size:var(--fs-base);color:var(--muted);flex:1;white-space:pre-line}
#najd .st-ft{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
#najd .st-price{font-size:var(--fs-3xl);font-weight:800;color:var(--dtext)}
#najd .st-price small{font-size:var(--fs-md);font-weight:700;color:var(--slate)}
#najd .st-price del{font-size:var(--fs-md);color:var(--slate);font-weight:500;margin-inline-start:6px}
#najd .st-ft .nj-btn{height:44px;padding:0 18px;font-size:var(--fs-base)}
#najd .st-plat{font-size:var(--fs-sm);color:var(--slate);text-align:center;margin-top:-2px}
#najd .st-sk{height:380px;border-radius:var(--r);background:linear-gradient(90deg,#fff 0%,var(--light) 50%,#fff 100%);background-size:200% 100%;animation:stSk 1.3s infinite linear;border:1px solid var(--line)}
@keyframes stSk{to{background-position:-200% 0}}
#najd .st-how{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-6);margin:28px 0 0}
#najd .st-how div{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
#najd .st-how b{display:block;font-size:var(--fs-lg)}

<div id="najd" dir="rtl" data-page="store">

<script src="assets/js/layout.js?v=20261113g"></script>
<script src="assets/js/i18n.js?v=20261113g"></script>
<script type="module" src="assets/js/auth.js?v=20261113g"></script>
<script>
(function(){
  var esc=window.Najd.esc,box=document.getElementById('st-list');
  var PLAT={salla:'سلة',zid:'زد'};
  var ICON='<svg viewBox="0 0 52 52" aria-hidden="true"><path d="M10 18h32l-3 24H13z" fill="#568A88"/><path d="M18 18v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#2F4F4E" stroke-width="3"/></svg>';
  function safe(u){u=String(u||'').trim();return /^https:\/\//i.test(u)?u:'';}
  function price(x){var n=+x.price;if(!x.price&&x.price!==0)return '';var o='<span class="st-price">'+(n===0?'مجاني':n.toLocaleString('en-US')+' <small>ريال</small>');if(+x.oldPrice>n)o+='<del>'+(+x.oldPrice).toLocaleString('en-US')+'</del>';return o+'</span>';}
  function card(x){
    var url=safe(x.link),img=safe(x.image);
    return '<article class="st-card"><div class="st-img">'+(img?'<img src="'+esc(img)+'" alt="'+esc(x.name)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'')+(img?'':ICON)+(x.badge?'<span class="nj-tag is-paid st-badge">'+esc(x.badge)+'</span>':'')+'</div>'
      +'<div class="st-body"><h3>'+esc(x.name)+'</h3>'+(x.desc?'<p>'+esc(x.desc)+'</p>':'<p></p>')
      +'<div class="st-ft">'+price(x)+(url?'<a class="nj-btn nj-btn-fill" href="'+esc(url)+'" target="_blank" rel="noopener">اطلب الحين ↗</a>':'')+'</div>'
      +(PLAT[x.platform]?'<p class="st-plat">الطلب يكمل في متجرنا على '+PLAT[x.platform]+'</p>':'')
      +'</div></article>';
  }
  var failT=setTimeout(function(){window.NajdStore.fail();},15000),done=false;
  window.NajdStore={
    set:function(list){
      done=true;clearTimeout(failT);
      list=(list||[]).filter(function(x){return x&&x.name&&x.active!==false;}).sort(function(a,b){return (+a.order||0)-(+b.order||0)||(b.createdAt&&b.createdAt.seconds||0)-(a.createdAt&&a.createdAt.seconds||0);});
      box.className=list.length?'st-grid':'';
      box.innerHTML=list.length?list.map(card).join(''):'<div class="nj-card nj-empty"><span class="nj-icon-xl">'+window.Najd.icon('store')+'</span><b>ما فيه منتجات حاليًا</b><p>نضيف منتجاتنا قريب، ارجع لنا.</p></div>';
    },
    fail:function(){if(done)return;box.className='';box.innerHTML='<div class="nj-card nj-empty"><span class="nj-icon-xl">'+window.Najd.icon('offline')+'</span><b>ما قدرنا نجيب المنتجات</b><p>تأكد من اتصالك بالإنترنت وحدّث الصفحة.</p></div>';}
  };
})();
</script>
<script type="module">
try {
  const { db } = await import("./assets/js/auth.js?v=20261113g");
  const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js");
  const snap = await getDocs(collection(db, "products"));
  const list = []; snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
  window.NajdStore.set(list);
} catch (e) { console.warn("najd store", e); window.NajdStore.fail(); }
</script>
