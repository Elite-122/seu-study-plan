(function(){
  var N=window.Najd,G=window.NAJD_GUIDE,EN=document.documentElement.lang==='en',LG=EN?'en':'ar',app=document.getElementById('gd-app');

        :[['#4F7CA8','الانسحاب من مقرر','تطلع من مادة وتكمل الباقي',[['متى','خلال الفصل، في الفترة المعلنة'],['ينرصد','(W) في المقرر'],['الشرط','يبقى معك 11 ساعة على الأقل'],['الرسوم','ما ترجع']]],['#B08A4E','الاعتذار عن الفصل','توقف الفصل كامل بعذر',[['متى','خلال الفصل، قبل نهاية الفترة المعلنة'],['ينرصد','(W) في كل مقرراتك'],['المدة','ينحسب من مدة دراستك'],['الرسوم','ما ترجع']]],['#6E8F5E','التأجيل','تأجل الفصل كامل',[['متى','أول الفصل، في الفترة المعلنة'],['ينرصد','ما ينرصد شي في المقررات'],['المدة','ما ينحسب من مدة دراستك'],['الرسوم','ما تنحسب رسوم دراسية']]]];
      return '<div class="gd-cmp">'+C.map(function(c){return '<div style="--c:'+c[0]+'"><h3>'+c[1]+'</h3><p>'+c[2]+'</p><dl>'+c[3].map(function(r){return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>';}).join('')+'</dl></div>';}).join('')+'</div>';}
    if(k==='meter')return '<div class="gd-meter" role="img" aria-label="'+L('ثلاث إنذارات متتالية ثم الفصل','Three consecutive warnings, then dismissal')+'"><div class="w1"><b>1</b><small>'+L('إنذار أول','1st warning')+'</small></div><div class="w2"><b>2</b><small>'+L('إنذار ثاني','2nd warning')+'</small></div><div class="w3"><b>3</b><small>'+L('إنذار ثالث','3rd warning')+'</small></div><div class="out"><b>'+L('فصل','Dismissal')+'</b><small>'+L('إلا لو انعطيت فرصة','unless granted a chance')+'</small></div></div>'
      +'<div class="gd-links"><a class="nj-btn nj-btn-line" href="gpa.html">'+N.icon('gpa')+L('احسب معدلك','Calculate your GPA')+'</a></div>';
    return '';}
  function draw(){
    var o='<div class="gd-top"><div class="gd-q">'+IC.q+'<input type="search" id="gd-q" autocomplete="off" placeholder="'+L('ابحث: حرمان، انسحاب، إنذار…','Search: barred, withdrawal, warning…')+'" aria-label="'+L('ابحث في الدليل','Search the guide')+'"></div>'
      +'<div class="gd-fast">'+(EN?[['s3','How many absences can I have?'],['s5','Withdraw or apologise?'],['s7','When is a warning issued?'],['s4','I missed an exam']]:[['s3','كم مرة أقدر أغيب؟'],['s5','انسحاب ولا اعتذار؟'],['s7','متى ينعطى الإنذار؟'],['s4','فاتني الاختبار']]).map(function(f){return '<a href="#'+f[0]+'">'+f[1]+'</a>';}).join('')+'</div><p class="gd-res" id="gd-res" aria-live="polite" hidden></p></div>';
    o+='<nav class="gd-toc" id="gd-toc" aria-label="'+L('أقسام الدليل','Guide sections')+'">'+G.S.map(function(s,i){var c=s[LG];return '<a href="#'+s.id+'"><span class="n">'+(i+1)+'</span><b>'+c.t+'</b><small>'+c.sub+'</small></a>';}).join('')+'</nav>';
    G.S.forEach(function(s,i){var c=s[LG];
      o+='<section class="gd-sec" id="'+s.id+'" aria-labelledby="'+s.id+'h"><header><span class="n">'+(i+1)+'</span><div><h2 id="'+s.id+'h">'+c.t+'</h2><small>'+c.sub+'</small></div></header>'
        +'<div class="gd-sum"><b class="h">'+L('الخلاصة','In short')+'</b><ul>'+c.sum.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>'
        +'<div class="gd-live">'+live(s.live)+'</div>'+tool(s.tool)
        +c.qa.map(function(q,j){return '<details id="'+s.id+'-'+(j+1)+'"><summary>'+q[0]+'</summary><div class="gd-a">'+q[1]+(q[2]?src(q[2]):'')+'</div></details>';}).join('')
        +'</section>';});
    o+='<p class="gd-empty" id="gd-empty" hidden>'+L('ما لقينا شي بهالكلمة. جرّب كلمة ثانية، مثل: غياب، رسوم، معدل.','Nothing found. Try another word, like absence, fees or GPA.')+'</p>';
    o+='<p class="gd-foot">'+L('هذا الدليل يبسّط اللوائح الرسمية ولا يغني عنها. لو اختلف شي، المرجع ','This guide simplifies the official rules and does not replace them. If anything differs, the reference is ')
      +'<a href="'+G.SRC.regs.u+'" target="_blank" rel="noopener">'+L('صفحة اللوائح في موقع الجامعة','the university\'s rules page')+'</a>'+L('. آخر مراجعة: ',' · Last reviewed: ')+new Intl.DateTimeFormat(EN?'en-GB':'ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(D(G.updated))+'.</p>';
    app.innerHTML=o;
  }
  draw();
  /* كم أقدر أغيب: الحرمان إذا تجاوز الغياب 25% */
  var n=document.getElementById('gd-n'),out=document.getElementById('gd-out');
  function calc(){var v=Math.max(1,Math.min(120,parseInt(n.value,10)||1)),m=Math.floor(v*0.25+1e-9);
    out.innerHTML=EN?'You can miss up to <b>'+m+'</b> '+(m===1?'lecture':'lectures')+'. Absence number '+(m+1)+' goes over 25% and bars you.'
      :'تقدر تغيب لين <b>'+m+'</b> '+(m===1?'محاضرة':m===2?'محاضرتين':m>=3&&m<=10?'محاضرات':'محاضرة')+' بالكثير. الغياب رقم '+(m+1)+' يتجاوز 25% ويحرمك.';}
  if(n){n.addEventListener('input',calc);calc();}
  /* البحث: نطابق بعد توحيد الهمزات والتاء المربوطة والياء */
  function norm(s){return String(s).toLowerCase().replace(/<[^>]+>/g,' ').replace(/[ً-ٰٟ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');}
  var q=document.getElementById('gd-q'),res=document.getElementById('gd-res'),empty=document.getElementById('gd-empty'),toc=document.getElementById('gd-toc');
  function find(){var t=norm(q.value.trim()),hits=0;
    [].forEach.call(app.querySelectorAll('.gd-sec'),function(sec){var any=false,head=t&&norm(sec.querySelector('header').textContent+' '+sec.querySelector('.gd-sum').textContent).indexOf(t)>=0;
      var own=0;[].forEach.call(sec.querySelectorAll('details'),function(d){var m=!!t&&norm(d.textContent).indexOf(t)>=0;d.hidden=!!t&&!m&&!head;d.open=m;if(m)own++;});
      if(own||head)any=true;hits+=own||(head?1:0);
      sec.hidden=!!t&&!any;});
    toc.hidden=!!t;res.hidden=!t;empty.hidden=!t||hits>0;
    if(t)res.textContent=hits?(EN?hits+(hits===1?' result':' results'):(hits===1?'نتيجة وحدة':hits===2?'نتيجتين':hits<=10?hits+' نتايج':hits+' نتيجة')):'';}
  q.addEventListener('input',find);
  var Q=new URLSearchParams(location.search).get('q');if(Q){q.value=Q;find();}
  /* رابط لسؤال معيّن (#s3-2) يفتحه */
  function openHash(){var h=location.hash.slice(1);if(!h)return;var el=document.getElementById(h);if(!el)return;if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({block:'start'});}
  openHash();window.addEventListener('hashchange',openHash);
})();
</script>
