<meta charset="utf-8">

<style>
#najd .ls-status{display:flex;align-items:center;gap:var(--sp-6);flex-wrap:wrap}
#najd .ls-status .ic{flex-shrink:0;width:52px;height:52px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:var(--fs-4xl);background:var(--tint)}
#najd .ls-status div{flex:1;min-width:220px}
#najd .ls-status h2{font-size:var(--fs-2xl)}
#najd .ls-status p{font-size:var(--fs-base);color:var(--muted)}
#najd .ls-status.is-on{border-color:var(--ok-line);background:#F3F8F0}
#najd .ls-status.is-on .ic{background:var(--ok-bg)}
#najd .ls-mail{direction:ltr;unicode-bidi:embed;font-weight:700;color:var(--dtext)}
#najd .ls-chips{margin:0 0 var(--sp-6)}
#najd .ls-gh{font-size:var(--fs-2xl);font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:var(--sp-4)}
#najd .ls-gh span{font-size:var(--fs-md);font-weight:700;color:var(--link);background:var(--tint);border-radius:var(--r-pill);padding:2px 12px}
#najd .ls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp-6)}
#najd .ls-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:var(--sp-3)}
#najd .ls-top{display:flex;gap:var(--sp-5);align-items:flex-start}
#najd .ls-type{flex-shrink:0;width:46px;height:46px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xl);background:var(--tint)}
#najd .ls-type.pdf{background:var(--err-bg)}
#najd .ls-card h3{font-size:var(--fs-body);font-weight:800;line-height:1.4}
#najd .ls-card small{font-size:var(--fs-md);color:var(--slate)}
#najd .ls-card p{font-size:var(--fs-base);color:var(--muted);flex:1}
#najd .ls-ft{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);padding-top:10px;border-top:1px solid var(--line)}
#najd .ls-ft .nj-btn{height:40px;padding:0 16px;font-size:var(--fs-base)}
#najd .ls-ft .is-locked{background:var(--bg);color:var(--slate);border-color:var(--line);box-shadow:none}
#najd .ls-subs{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin:6px 0 0}
#najd .ls-sub{display:inline-flex;align-items:center;gap:var(--sp-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 12px;font-size:var(--fs-md);font-weight:700}
#najd .ls-sub small{font-weight:500;color:var(--slate);font-size:var(--fs-xs)}
#najd .ls-status .ic .nj-icon{width:28px;height:28px}
#najd .ls-type .nj-icon{width:24px;height:24px}
</style>
</head>
<body>
<div id="najd" dir="rtl" data-auth="required" data-page="lessons">
<div id="nj-header"></div>
<section class="nj-band">
<svg class="nj-band-mark" viewBox="14 20 92 84" aria-hidden="true"><path d="M26 48 L36 36 L46 48 Z" fill="#758A8C"/><path d="M50 48 L60 30 L70 48 Z" fill="#7A9FA3"/><path d="M74 48 L84 24 L94 48 Z" fill="#C8CFD2"/><path d="M58 100 L18 88 V56 L58 68 Z" fill="#C8CFD2"/><path d="M62 100 L102 88 V56 L62 68 Z" fill="#E4E9EB"/></svg>
<div class="nj-in">
<p class="nj-crumb"><a href="index.html">الرئيسية</a><span>/</span>الشروحات</p>
<h1>الشروحات</h1>
<p class="nj-band-sub">شروحات فيديو وملفات PDF مرتبة حسب المقرر. بعضها مجاني، والباقي للمشتركين.</p>
</div>
</section>
<main class="nj-main">
<div class="nj-in">
<div class="nj-card ls-status" id="ls-status"><span class="ic">⏳</span><div><h2>جاري التحقق من اشتراكك…</h2></div></div>
<div class="nj-chips ls-chips" id="ls-chips" role="group" aria-label="المقرر"></div>
<div id="ls-list"></div>
</div>
</main>
<div id="nj-footer"></div>
</div>
<script src="assets/js/layout.js?v=20261113e"></script>
<script src="assets/js/i18n.js?v=20261113e"></script>
<script src="assets/js/courses-data.js?v=20261113e"></script>
<script src="assets/js/access.js?v=20261113e"></script>
<script type="module" src="assets/js/auth.js?v=20261113e"></script>
<script type="module">
const esc = window.Najd.esc, $ = (id) => document.getElementById(id);
let lessons = [], grants = [], verified = false, course = "", user = null, F = null;
const NA = window.NajdAccess, kindOf = (x) => (x.type === "pdf" ? "pdf" : "video");
const canOpen = (x) => x.free || (verified && NA.has(grants, x.code, kindOf(x)));
const groupOf = (x) => (x.code ? NA.label(x.code) : (x.course || "عام"));

function ytId(u) {
  const m = String(u || "").match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  return m ? m[1] : "";
}
function fmt(ts) { try { return ts.toDate().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); } catch (e) { return ""; } }

function status() {
  const s = $("ls-status"), mail = esc((user && user.email) || ""), live = grants.filter((g) => g.live);
  s.classList.toggle("is-on", verified && live.length > 0);
  if (live.length && !verified) {
    s.innerHTML = `<span class="ic">${window.Najd.icon("mail")}</span><div><h2>أكّد بريدك عشان يتفعّل اشتراكك</h2><p>أرسلنا لك رابط تأكيد على <span class="ls-mail">${mail}</span>. بعد ما تضغطه، سجّل خروج وادخل من جديد.</p></div><button type="button" class="nj-btn nj-btn-line" id="ls-verify">أعد إرسال رابط التأكيد</button>`;
    $("ls-verify").onclick = async () => { try { await F.sendEmailVerification(user); window.Najd.toast("أرسلنا الرابط"); } catch (e) { window.Najd.toast("انتظر شوي وجرب مرة ثانية"); } };
  } else if (live.length) {
    s.innerHTML = `<span class="ic">${window.Najd.icon("check")}</span><div><h2>اشتراكاتك</h2><div class="ls-subs">${live.map((g) => `<span class="ls-sub"><b dir="auto">${esc(g.code === "all" ? "كل المقررات" : g.code)}</b>${esc(NA.KINDS[g.kind] || "")}${g.until ? `<small>لين <span data-no-i18n>${esc(NA.fmt(g.until))}</span></small>` : ""}</span>`).join("")}</div></div>`;
  } else {
    s.innerHTML = `<span class="ic">${window.Najd.icon("lock")}</span><div><h2>الشروحات والملخصات المدفوعة تحتاج اشتراك</h2><p>اشترك في المقرر اللي تبيه من المتجر، وبنفعّله على بريد حسابك: <span class="ls-mail">${mail || "—"}</span></p></div><a class="nj-btn nj-btn-fill" href="store.html">اشترك من المتجر</a>`;
  }
}

function render() {
  const list = lessons.filter((x) => x.active !== false);
  const mineN = list.filter((x) => !x.free && canOpen(x)).length;
  const courses = [...new Set(list.map(groupOf))];
  $("ls-chips").innerHTML = courses.length > 1 || mineN ? [`<button type="button" class="nj-chip ls-chip" data-c="" aria-pressed="${!course}">الكل (${list.length})</button>`].concat(mineN ? [`<button type="button" class="nj-chip is-accent ls-chip" data-c="__mine" aria-pressed="${course === "__mine"}">المفتوح لك (${mineN})</button>`] : []).concat(courses.map((c) => `<button type="button" class="nj-chip ls-chip" data-c="${esc(c)}" aria-pressed="${course === c}">${esc(c)}</button>`)).join("") : "";
  const view = course === "__mine" ? list.filter((x) => !x.free && canOpen(x)) : course ? list.filter((x) => groupOf(x) === course) : list;
  if (!view.length) { $("ls-list").innerHTML = '<div class="nj-card nj-empty"><span class="nj-icon-xl">'+window.Najd.icon('book')+'</span><b>ما فيه شروحات منشورة حاليًا</b><p>نضيف الشروحات أول بأول، ارجع لنا قريب.</p></div>'; return; }
  const groups = {}; view.forEach((x) => { const c = groupOf(x); (groups[c] = groups[c] || []).push(x); });
  $("ls-list").innerHTML = Object.keys(groups).map((c) => `<h2 class="ls-gh">${esc(c)} <span>${groups[c].length}</span></h2><div class="ls-grid">` + groups[c].map((x) => {
    const open = canOpen(x), vid = x.type !== "pdf";
    return `<article class="ls-card"><div class="ls-top"><span class="ls-type ${vid ? "" : "pdf"}">${window.Najd.icon(vid ? "play" : "file")}</span><div><h3 data-no-i18n>${esc(x.title)}</h3><small>${vid ? "شرح فيديو" : "ملخص PDF"}</small></div></div>`
      + `<p data-no-i18n>${esc(x.desc || "")}</p>`
      + `<div class="ls-ft"><span class="nj-tag${x.free ? "" : open ? " is-ok" : " is-paid"}">${x.free ? "مجاني" : open ? "مشترك" : vid ? "لمشتركي الشروحات" : "لمشتركي الملخصات"}</span>`
      + (open ? `<button type="button" class="nj-btn nj-btn-fill" data-open="${x.id}">${vid ? "شاهد" : "افتح الملف"}</button>` : `<a class="nj-btn nj-btn-line is-locked" href="store.html">${window.Najd.icon("lock")}اشترك</a>`)
      + `</div></article>`;
  }).join("") + "</div>").join("");
}

function play(title, id) {
  const m = document.createElement("div"); m.className = "nj-modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-label", title);
  m.innerHTML = `<div class="nj-modal-box"><button type="button" class="nj-modal-x" aria-label="إغلاق">×</button><div class="nj-modal-t">${esc(title)}</div><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&autoplay=1" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  const close = () => { m.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  m.addEventListener("click", (e) => { if (e.target === m || e.target.closest(".nj-modal-x")) close(); });
  document.addEventListener("keydown", onKey);
  document.getElementById("najd").appendChild(m);
  m.querySelector(".nj-modal-x").focus();
}

$("ls-chips").addEventListener("click", (e) => { const b = e.target.closest(".ls-chip"); if (!b) return; course = b.getAttribute("data-c"); render(); });
$("ls-list").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-open]"); if (!b) return;
  const x = lessons.find((l) => l.id === b.getAttribute("data-open")); b.disabled = true;
  try {
    const s = await F.getDoc(F.doc(F.db, "lessonLinks", x.id));
    const url = s.exists() ? String(s.data().url || "") : "";
    if (x.type !== "pdf" && ytId(url)) play(x.title, ytId(url));
    else if (/^https:\/\//i.test(url)) window.open(url, "_blank", "noopener");
    else window.Najd.toast("الرابط غير متوفر حاليًا");
  } catch (er) { window.Najd.toast(canOpen(x) ? "ما قدرنا نفتح الشرح، جرب مرة ثانية" : "هذا الشرح للمشتركين"); }
  b.disabled = false;
});

try {
  const A = await import("./assets/js/auth.js?v=20261113e");
  const fs = await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js");
  const fa = await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js");
  F = { db: A.db, doc: fs.doc, getDoc: fs.getDoc, sendEmailVerification: fa.sendEmailVerification };
  fa.onAuthStateChanged(A.auth, async (u) => {
    user = u; if (!u) return;
    try {
      verified = !!u.emailVerified;
      if (u.email) { const a = await fs.getDoc(fs.doc(A.db, "access", u.email.toLowerCase())); grants = a.exists() ? NA.list(a.data()) : []; }
    } catch (e) { console.warn(e); }
    status();
    const snap = await fs.getDocs(fs.collection(A.db, "lessons"));
    lessons = []; snap.forEach((d) => lessons.push({ id: d.id, ...d.data() }));
    lessons.sort((a, b) => (+a.order || 0) - (+b.order || 0) || String(a.title).localeCompare(String(b.title), "ar"));
    render();
  });
} catch (e) {
  console.warn("najd lessons", e);
  $("ls-status").innerHTML = '<span class="ic">'+window.Najd.icon('offline')+'</span><div><h2>ما قدرنا نجيب الشروحات</h2><p>تأكد من اتصالك بالإنترنت وحدّث الصفحة.</p></div>';
}
</script>
</body>
</html>
