<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الشروحات | أكاديمية نجد</title>
<meta name="description" content="شروحات فيديو وملفات PDF مرتبة حسب المقرر، لطلاب أكاديمية نجد.">
<meta name="theme-color" content="#2F4F4E">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/najd.css">
<style>
#najd .ls-status{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#najd .ls-status .ic{flex-shrink:0;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--tint)}
#najd .ls-status div{flex:1;min-width:220px}
#najd .ls-status h2{font-size:20px}
#najd .ls-status p{font-size:15px;color:var(--muted)}
#najd .ls-status.is-on{border-color:#C9DBC0;background:#F3F8F0}
#najd .ls-status.is-on .ic{background:#E2ECDD}
#najd .ls-mail{direction:ltr;unicode-bidi:embed;font-weight:700;color:var(--deep)}
#najd .ls-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
#najd .ls-chip{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
#najd .ls-chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
#najd .ls-gh{font-size:21px;font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
#najd .ls-gh span{font-size:14px;font-weight:700;color:var(--teal);background:var(--tint);border-radius:999px;padding:2px 12px}
#najd .ls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
#najd .ls-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
#najd .ls-top{display:flex;gap:12px;align-items:flex-start}
#najd .ls-type{flex-shrink:0;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--tint)}
#najd .ls-type.pdf{background:#F6E4E1}
#najd .ls-card h3{font-size:17.5px;font-weight:800;line-height:1.4}
#najd .ls-card small{font-size:13.5px;color:var(--slate)}
#najd .ls-card p{font-size:14.5px;color:var(--muted);flex:1}
#najd .ls-ft{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
#najd .ls-tag{font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--tint);color:var(--teal)}
#najd .ls-tag.paid{background:var(--deep);color:#fff}
#najd .ls-ft .nj-btn{height:40px;padding:0 16px;font-size:14.5px}
#najd .ls-ft .is-locked{background:var(--bg);color:var(--slate);border-color:var(--line);box-shadow:none}
#najd .ls-empty{text-align:center;padding:40px 20px}
#najd .ls-empty b{display:block;font-size:20px;font-weight:800;margin:8px 0 4px}
#najd .ls-empty p{color:var(--muted)}
</style>
</head>
<body>
<div id="najd" dir="rtl" data-auth="required" data-page="lessons">
<div id="nj-header"></div>
<section class="nj-band">
<svg class="nj-band-mark" viewBox="14 20 92 84" aria-hidden="true"><path d="M26 48 L36 36 L46 48 Z" fill="#758A8C"/><path d="M50 48 L60 30 L70 48 Z" fill="#7A9FA3"/><path d="M74 48 L84 24 L94 48 Z" fill="#C8CFD2"/><path d="M58 100 L18 88 V56 L58 68 Z" fill="#C8CFD2"/><path d="M62 100 L102 88 V56 L62 68 Z" fill="#E4E9EB"/></svg>
<div class="nj-in">
<p class="nj-crumb"><a href="index.html">الرئيسية</a><span>/</span>الشروحات</p>
<h1>الشروحات</h1>
<p class="nj-band-sub">شروحات فيديو وملفات PDF مرتبة حسب المقرر. بعضها مجاني، والباقي للمشتركين.</p>
</div>
</section>
<main class="nj-main">
<div class="nj-in">
<div class="nj-card ls-status" id="ls-status"><span class="ic">⏳</span><div><h2>جاري التحقق من اشتراكك…</h2></div></div>
<div class="ls-chips" id="ls-chips" role="group" aria-label="المقرر"></div>
<div id="ls-list"></div>
</div>
</main>
<div id="nj-footer"></div>
</div>
<script src="assets/js/layout.js"></script>
<script type="module" src="assets/js/auth.js"></script>
<script type="module">
const esc = window.Najd.esc, $ = (id) => document.getElementById(id);
let lessons = [], access = false, course = "", user = null, F = null;

function ytId(u) {
  const m = String(u || "").match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  return m ? m[1] : "";
}
function fmt(ts) { try { return ts.toDate().toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return ""; } }

function status(acc, info) {
  const s = $("ls-status"), mail = esc((user && user.email) || "");
  s.classList.toggle("is-on", !!acc);
  if (acc) {
    s.innerHTML = `<span class="ic">✅</span><div><h2>اشتراكك مفعّل</h2><p>${info && info.until ? "ينتهي " + esc(fmt(info.until)) + ". " : ""}كل الشروحات مفتوحة لك.</p></div>`;
  } else if (info === "unverified") {
    s.innerHTML = `<span class="ic">📧</span><div><h2>أكّد بريدك عشان يتفعّل اشتراكك</h2><p>أرسلنا لك رابط تأكيد على <span class="ls-mail">${mail}</span>. بعد ما تضغطه، سجّل خروج وادخل من جديد.</p></div><button type="button" class="nj-btn nj-btn-line" id="ls-verify">أعد إرسال رابط التأكيد</button>`;
    $("ls-verify").onclick = async () => { try { await F.sendEmailVerification(user); window.Najd.toast("أرسلنا الرابط 📬"); } catch (e) { window.Najd.toast("انتظر شوي وجرب مرة ثانية"); } };
  } else {
    s.innerHTML = `<span class="ic">🔒</span><div><h2>الشروحات المدفوعة تحتاج اشتراك</h2><p>اشترِ الاشتراك من المتجر، وبنفعّله على بريد حسابك: <span class="ls-mail">${mail || "—"}</span></p></div><a class="nj-btn nj-btn-fill" href="store.html">اشترك من المتجر</a>`;
  }
}

function render() {
  const list = lessons.filter((x) => x.active !== false);
  const courses = [...new Set(list.map((x) => x.course || "عام"))];
  $("ls-chips").innerHTML = courses.length > 1 ? [`<button type="button" class="ls-chip" data-c="" aria-pressed="${!course}">الكل (${list.length})</button>`].concat(courses.map((c) => `<button type="button" class="ls-chip" data-c="${esc(c)}" aria-pressed="${course === c}">${esc(c)}</button>`)).join("") : "";
  const view = course ? list.filter((x) => (x.course || "عام") === course) : list;
  if (!view.length) { $("ls-list").innerHTML = '<div class="nj-card ls-empty"><span style="font-size:40px">📚</span><b>ما فيه شروحات منشورة حاليًا</b><p>نضيف الشروحات أول بأول، ارجع لنا قريب.</p></div>'; return; }
  const groups = {}; view.forEach((x) => { const c = x.course || "عام"; (groups[c] = groups[c] || []).push(x); });
  $("ls-list").innerHTML = Object.keys(groups).map((c) => `<h2 class="ls-gh">${esc(c)} <span>${groups[c].length}</span></h2><div class="ls-grid">` + groups[c].map((x) => {
    const open = x.free || access, vid = x.type !== "pdf";
    return `<article class="ls-card"><div class="ls-top"><span class="ls-type ${vid ? "" : "pdf"}">${vid ? "▶️" : "📄"}</span><div><h3>${esc(x.title)}</h3><small>${vid ? "فيديو" : "ملف PDF"}</small></div></div>`
      + `<p>${esc(x.desc || "")}</p>`
      + `<div class="ls-ft"><span class="ls-tag ${x.free ? "" : "paid"}">${x.free ? "مجاني" : "للمشتركين"}</span>`
      + (open ? `<button type="button" class="nj-btn nj-btn-fill" data-open="${x.id}">${vid ? "شاهد" : "افتح الملف"}</button>` : `<a class="nj-btn nj-btn-line is-locked" href="store.html">🔒 اشترك</a>`)
      + `</div></article>`;
  }).join("") + "</div>").join("");
}

function play(title, id) {
  const m = document.createElement("div"); m.className = "nj-modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-label", title);
  m.innerHTML = `<div class="nj-modal-box"><button type="button" class="nj-modal-x" aria-label="إغلاق">×</button><div class="nj-modal-t">${esc(title)}</div><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&autoplay=1" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  const close = () => { m.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  m.addEventListener("click", (e) => { if (e.target === m || e.target.closest(".nj-modal-x")) close(); });
  document.addEventListener("keydown", onKey);
  document.getElementById("najd").appendChild(m);
  m.querySelector(".nj-modal-x").focus();
}

$("ls-chips").addEventListener("click", (e) => { const b = e.target.closest(".ls-chip"); if (!b) return; course = b.getAttribute("data-c"); render(); });
$("ls-list").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-open]"); if (!b) return;
  const x = lessons.find((l) => l.id === b.getAttribute("data-open")); b.disabled = true;
  try {
    const s = await F.getDoc(F.doc(F.db, "lessonLinks", x.id));
    const url = s.exists() ? String(s.data().url || "") : "";
    if (x.type !== "pdf" && ytId(url)) play(x.title, ytId(url));
    else if (/^https:\/\//i.test(url)) window.open(url, "_blank", "noopener");
    else window.Najd.toast("الرابط غير متوفر حاليًا");
  } catch (er) { window.Najd.toast(access || x.free ? "ما قدرنا نفتح الشرح، جرب مرة ثانية" : "هذا الشرح للمشتركين 🔒"); }
  b.disabled = false;
});

try {
  const A = await import("./assets/js/auth.js");
  const fs = await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js");
  const fa = await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js");
  F = { db: A.db, doc: fs.doc, getDoc: fs.getDoc, sendEmailVerification: fa.sendEmailVerification };
  fa.onAuthStateChanged(A.auth, async (u) => {
    user = u; if (!u) return;
    let info = null;
    try {
      if (u.email) {
        const a = await fs.getDoc(fs.doc(A.db, "access", u.email.toLowerCase()));
        if (a.exists()) {
          info = a.data();
          const live = !info.until || info.until.toMillis() > Date.now();
          if (live && !u.emailVerified) info = "unverified";
          else access = live;
        }
      }
    } catch (e) { console.warn(e); }
    status(access, info);
    const snap = await fs.getDocs(fs.collection(A.db, "lessons"));
    lessons = []; snap.forEach((d) => lessons.push({ id: d.id, ...d.data() }));
    lessons.sort((a, b) => (+a.order || 0) - (+b.order || 0) || String(a.title).localeCompare(String(b.title), "ar"));
    render();
  });
} catch (e) {
  console.warn("najd lessons", e);
  $("ls-status").innerHTML = '<span class="ic">📡</span><div><h2>ما قدرنا نجيب الشروحات</h2><p>تأكد من اتصالك بالإنترنت وحدّث الصفحة.</p></div>';
}
</script>
</body>
</html>
